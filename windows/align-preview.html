<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- script-src moet 'unsafe-inline' bevatten: anders draait het grote inline <script>-blok niet (geen IPC → geen beeld/frames). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Film2Frame – UITLIJN</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; color: #e0e0e0; font-family: system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; }
    /* Titelregel bovenaan in de toolbar, zelfde typografie als Scanlint-kop (h1 + bestandsnaam) */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 0;
      border-bottom: 1px solid #444;
      background: #252525;
      min-width: 0;
    }
    .toolbar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
      min-width: 0;
    }
    .toolbar-head h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      flex: 0 1 auto;
      min-width: 0;
    }
    .header-filename {
      flex: 0 1 auto;
      max-width: min(520px, 55vw);
      font-size: 12px;
      font-weight: 500;
      color: #9cdcfe;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      min-width: 0;
    }
    .toolbar-controls label { color: #aaa; margin-right: 4px; }
    .zoom-select { padding: 6px 8px; background: #2a2a2a; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 13px; }
    .viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      background: #0d0d0d;
    }
    .placeholder { color: #888; padding: 24px; text-align: center; max-width: 520px; margin: 0 auto; line-height: 1.45; }
    /* Strip-bitmap alleen als JavaScript Image() — geen 0×0 <img> in DOM (Chromium decode/naturalWidth blijft dan 0). */
    /* Geen max-width: schaalde het beeld naar 0–vervormd/zwart; 1 canvaspx = 1 schermpx, pannen met scrollbalken */
    #align-canvas {
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 0 1px #444;
      image-rendering: auto;
    }
    .align-lock-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
      padding-left: 12px;
      border-left: 1px solid #444;
    }
    .align-lock-row label { cursor: pointer; user-select: none; color: #ccc; font-size: 12px; }
    .align-lock-row input { width: auto; margin: 0; }
    .toolbar-head-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 1 auto;
      min-width: 0;
    }
    .btn-align-refresh {
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e8e8e8;
      font-weight: 500;
    }
    .btn-align-refresh:hover { background: #333; border-color: #666; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-head">
      <h1>UITLIJN</h1>
      <div class="toolbar-head-right">
        <button type="button" id="btn-align-refresh" class="btn-align-refresh" title="Laatste strip opnieuw uit het hoofdvenster (zelfde als Scanlint).">Beeld vernieuwen</button>
        <span id="align-header-filename" class="header-filename" title="">—</span>
      </div>
    </div>
    <div class="toolbar-controls">
      <span>
        <label for="align-sel-frame">Frame</label>
        <select id="align-sel-frame" class="zoom-select" aria-label="Frame"></select>
      </span>
      <span>
        <label for="align-sel-zoom">Zoom</label>
        <select id="align-sel-zoom" class="zoom-select" aria-label="Zoom (vergroting van het geselecteerde frame)">
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2" selected>200%</option>
          <option value="2.5">250%</option>
          <option value="3">300%</option>
          <option value="4">400%</option>
          <option value="6">600%</option>
          <option value="8">800%</option>
          <option value="10">1000%</option>
          <option value="12">1200%</option>
        </select>
      </span>
      <span class="align-lock-row" title="Aan: bij rasterwijziging blijft het zicht op dezelfde plek (scroll). Uit: actief frame wordt gecentreerd.">
        <label for="align-chk-lock-scroll">
          <input type="checkbox" id="align-chk-lock-scroll" checked />
          Beeldpositie vasthouden
        </label>
      </span>
    </div>
  </div>
  <div class="viewport" id="align-viewport">
    <p class="placeholder" id="align-placeholder">Geen scanlint geladen. Open een project en laad een scanlint in het hoofdvenster; het UITLIJN-venster vult zich daarna automatisch. Tip: Zoom vergroot het hele lint; scroll verticaal (en horizontaal) om alle frames te zien. Framenumers staan in elke cel.</p>
    <canvas id="align-canvas" width="1" height="1" style="display:none"></canvas>
  </div>
  <script>
    (function () {
      var alignPreviewBootstrapped = false;

      function attachAlignPreview(api) {
        if (!api || !api.onAlignPreviewUpdate) return false;
        if (alignPreviewBootstrapped) return true;
        alignPreviewBootstrapped = true;

      var LS_FRAME = 'alignPreviewDetailFrame';
      var LS_ZOOM = 'alignPreviewDetailZoom';
      var LS_LOCK_SCROLL = 'alignPreviewLockScroll';

      var lastPayload = null;
      /** Zelfde logica als scanlint: voorkom decode/herlaad bij elke grid-only update met gemergede stripDataUrl. */
      var lastAlignStripDataUrl = '';
      var viewport = document.getElementById('align-viewport');
      /** Losstaand Image-object (niet in DOM): voorkomt Chromium-bug waarbij 0×0 <img> nooit decodeert. */
      var stripBitmap = new Image();
      var canvas = document.getElementById('align-canvas');
      var placeholder = document.getElementById('align-placeholder');
      var selFrame = document.getElementById('align-sel-frame');
      var selZoom = document.getElementById('align-sel-zoom');
      var headerFilenameEl = document.getElementById('align-header-filename');
      var chkLockScroll = document.getElementById('align-chk-lock-scroll');

      function getAlignStripTopY(p) {
        if (!p) return 0;
        var raw = p.alignStripTopY;
        if (raw != null && Number.isFinite(Number(raw))) return Math.round(Number(raw));
        var dh = Math.max(1, p.displayHeight || 1);
        var extH = Math.max(dh, p.extendedDisplayHeight || dh);
        return Math.round((extH - dh) / 2);
      }

      function updateHeaderFilename(p) {
        if (!headerFilenameEl) return;
        var raw = p && p.lintFileName != null ? String(p.lintFileName).trim() : '';
        if (!raw) {
          headerFilenameEl.textContent = '—';
          headerFilenameEl.title = '';
        } else {
          headerFilenameEl.textContent = raw;
          headerFilenameEl.title = raw;
        }
      }

      function loadPrefs() {
        try {
          var fz = localStorage.getItem(LS_FRAME);
          if (fz == null) fz = localStorage.getItem('stripDetailFrame');
          if (fz != null && selFrame) selFrame.dataset.pending = fz;
          var zz = localStorage.getItem(LS_ZOOM);
          if (zz == null) zz = localStorage.getItem('stripDetailZoom');
          if (zz != null && selZoom) {
            var z = parseFloat(zz);
            if (Number.isFinite(z) && z > 0) selZoom.value = String(z);
          }
          var lk = localStorage.getItem(LS_LOCK_SCROLL);
          if (chkLockScroll) chkLockScroll.checked = lk === null ? true : lk === '1';
        } catch (e) {}
      }
      function savePrefs() {
        try {
          if (selFrame && selFrame.value) localStorage.setItem(LS_FRAME, selFrame.value);
          if (selZoom && selZoom.value) localStorage.setItem(LS_ZOOM, selZoom.value);
          if (chkLockScroll) localStorage.setItem(LS_LOCK_SCROLL, chkLockScroll.checked ? '1' : '0');
        } catch (e) {}
      }

      function saveScrollAnchor() {
        if (!viewport || !chkLockScroll || !chkLockScroll.checked) return null;
        var sw = viewport.scrollWidth;
        var sh = viewport.scrollHeight;
        var vw = viewport.clientWidth;
        var vh = viewport.clientHeight;
        if (sw < 1 || sh < 1 || vw < 1 || vh < 1) return null;
        return {
          rx: (viewport.scrollLeft + vw / 2) / sw,
          ry: (viewport.scrollTop + vh / 2) / sh
        };
      }

      function restoreScrollAnchor(anchor) {
        if (!anchor || !viewport) return;
        requestAnimationFrame(function () {
          var sw = viewport.scrollWidth;
          var sh = viewport.scrollHeight;
          var vw = viewport.clientWidth;
          var vh = viewport.clientHeight;
          if (sw < 1 || sh < 1) return;
          viewport.scrollLeft = Math.max(0, Math.min(sw - vw, anchor.rx * sw - vw / 2));
          viewport.scrollTop = Math.max(0, Math.min(sh - vh, anchor.ry * sh - vh / 2));
        });
      }

      /** Geselecteerd frame centreren in viewport (1:1 canvas, geen CSS-schaal). */
      function scrollDetailToActiveFrame(cxCanvas, cyCanvas) {
        if (!viewport || (chkLockScroll && chkLockScroll.checked)) return;
        if (!Number.isFinite(cxCanvas) || !Number.isFinite(cyCanvas)) return;
        requestAnimationFrame(function () {
          var c = canvas;
          if (!c || c.style.display === 'none') return;
          var ox = c.offsetLeft;
          var oy = c.offsetTop;
          var vw = viewport.clientWidth;
          var vh = viewport.clientHeight;
          viewport.scrollLeft = Math.max(0, ox + cxCanvas - vw / 2);
          viewport.scrollTop = Math.max(0, oy + cyCanvas - vh / 2);
        });
      }

      function refLineDisplayFromPayload(p) {
        var gr = p.gridRects;
        if (!gr || gr.length === 0) return null;
        var n = gr.length;
        var mode = p.verticalAnchorMode || 'bottomFixed';
        var k;
        if (mode === 'pivotTop') k = 0;
        else if (mode === 'pivotActive') {
          var an = p.activeFrameNumber != null ? p.activeFrameNumber : (p.activeFrameIndex != null ? p.activeFrameIndex + 1 : 1);
          k = Math.max(0, Math.min(n, Math.floor(Number(an)) || 1));
        } else if (mode === 'pivotMiddleUpper' || mode === 'pivotMiddle') {
          k = Math.min(n, Math.max(1, Math.ceil(n / 2)));
        } else if (mode === 'pivotMiddleLower') {
          k = Math.min(n, Math.max(1, Math.floor(n / 2)));
        }
        else if (mode === 'pivotCustom') {
          k = Math.floor(Number(p.verticalAnchorCustomK));
          if (!Number.isFinite(k)) k = 1;
          k = Math.max(0, Math.min(n, k));
        } else k = n;
        var r0 = gr[0];
        var x0 = Number(r0.x) || 0;
        var w0 = Math.max(0, Number(r0.width) || 0);
        if (w0 <= 0) return null;
        var yLine;
        if (k <= 0) yLine = Number(r0.y) || 0;
        else if (k >= n) {
          var last = gr[n - 1];
          yLine = (Number(last.y) || 0) + Math.max(0, Number(last.height) || 0);
        } else {
          var r = gr[k];
          yLine = Number(r.y) || 0;
        }
        return { y: yLine, x0: x0, w: w0 };
      }

      function syncFrameOptions(p) {
        if (!selFrame || !p || !p.gridRects || p.gridRects.length === 0) return;
        var n = p.gridRects.length;
        var want = selFrame.dataset.pending != null ? parseInt(selFrame.dataset.pending, 10) : parseInt(selFrame.value, 10);
        if (!Number.isFinite(want) || want < 1) {
          var an = p.activeFrameNumber != null ? p.activeFrameNumber : (p.activeFrameIndex != null ? p.activeFrameIndex + 1 : 1);
          want = Math.max(1, Math.min(n, Math.floor(Number(an)) || 1));
        }
        delete selFrame.dataset.pending;
        if (want > n) want = n;
        var html = '';
        for (var i = 1; i <= n; i++) {
          html += '<option value="' + i + '">' + i + '</option>';
        }
        selFrame.innerHTML = html;
        selFrame.value = String(want);
      }

      function drawDetailError(msg) {
        var ctxE = canvas.getContext('2d');
        if (!ctxE) return;
        canvas.width = 480;
        canvas.height = 120;
        canvas.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
        ctxE.fillStyle = '#2a2a2a';
        ctxE.fillRect(0, 0, canvas.width, canvas.height);
        ctxE.fillStyle = '#e0a030';
        ctxE.font = '13px system-ui';
        var lines = String(msg || 'Fout').split('\n');
        for (var li = 0; li < lines.length; li++) {
          ctxE.fillText(lines[li], 12, 22 + li * 18);
        }
      }

      var alignViewportResizeHooked = false;
      function ensureAlignViewportResizeHook() {
        if (alignViewportResizeHooked || !viewport) return;
        alignViewportResizeHooked = true;
        function onResize() {
          if (lastPayload && stripBitmap.complete && stripBitmap.naturalWidth > 0) {
            requestAnimationFrame(drawDetailFrame);
          }
        }
        window.addEventListener('resize', onResize);
        if (typeof ResizeObserver !== 'undefined') {
          try {
            var ro = new ResizeObserver(onResize);
            ro.observe(viewport);
          } catch (e) {}
        }
      }

      function drawDetailFrame() {
        if (!canvas || !lastPayload || !selFrame) return;
        var p = lastPayload;
        if (!p.gridRects || p.gridRects.length === 0) return;
        if (!stripBitmap.complete || stripBitmap.naturalWidth < 1 || stripBitmap.naturalHeight < 1) return;

        ensureAlignViewportResizeHook();

        var scrollAnchor = saveScrollAnchor();

        var fn = parseInt(selFrame.value, 10);
        if (!Number.isFinite(fn) || fn < 1) fn = 1;
        if (fn > p.gridRects.length) fn = p.gridRects.length;
        var detailZ = parseFloat(selZoom.value);
        if (!Number.isFinite(detailZ) || detailZ <= 0) detailZ = 2;

        var gr = p.gridRects.find(function (r) { return r.frameNumber === fn; }) || p.gridRects[fn - 1];
        var w = Math.max(1, p.displayWidth || 1);
        var dh = Math.max(1, p.displayHeight || 1);
        var imgStripTop = getAlignStripTopY(p);
        var gx = Number(gr.x) || 0;
        var gy = Number(gr.y) || 0;
        var grw = Math.max(1, Number(gr.width) || 1);
        var grh = Math.max(1, Number(gr.height) || 1);
        /**
         * Hele uitlijnlint verticaal tekenen (zelfde Y-ruimte als gridRects), zodat je na inzoomen
         * met de scrollbalk over het volledige lint kunt bewegen. Eerder: slice ~ viewport/detailZ
         * werd bij hogere zoom steeds kleiner → max. ~ halve lint bereikbaar.
         */
        var extHForAlign = Math.max(dh, Number(p.extendedDisplayHeight) || dh);
        var y0 = 0;
        var y1 = extHForAlign;

        function finishScroll(cx, cy) {
          if (scrollAnchor) restoreScrollAnchor(scrollAnchor);
          else scrollDetailToActiveFrame(cx, cy);
        }

        if (y1 <= y0) {
          var ctx0 = canvas.getContext('2d');
          if (ctx0) {
            canvas.width = Math.max(1, Math.round(w * detailZ));
            canvas.height = Math.max(1, Math.round(grh * detailZ));
            canvas.style.display = 'block';
            placeholder.style.display = 'none';
            ctx0.fillStyle = '#222';
            ctx0.fillRect(0, 0, canvas.width, canvas.height);
            ctx0.fillStyle = '#888';
            ctx0.font = '12px system-ui';
            ctx0.fillText('Frame buiten beeld', 8, 20);
          }
          finishScroll(canvas.width / 2, canvas.height / 2);
          return;
        }

        var nx = stripBitmap.naturalWidth;
        var ny = stripBitmap.naturalHeight;
        if (Math.abs(nx - w) > 2 || Math.abs(ny - dh) > 2) {
          console.warn('[UITLIJN] Bitmap', nx, '×', ny, 'verwacht', w, '×', dh, '(payload)');
        }
        var sx = 0;
        var sw = nx;
        var sliceH = y1 - y0;
        /* Chromium: canvasafmeting per zijde oplopen (~16k); anders zwart/lege tekening. */
        var MAX_CANVAS_SIDE = 16300;
        var zEff = detailZ;
        var cw0 = w * detailZ;
        var ch0 = sliceH * detailZ;
        if (cw0 > MAX_CANVAS_SIDE || ch0 > MAX_CANVAS_SIDE) {
          zEff = Math.min(detailZ, MAX_CANVAS_SIDE / w, MAX_CANVAS_SIDE / sliceH);
        }
        var cw = Math.max(1, Math.round(w * zEff));
        var ch = Math.max(1, Math.round(sliceH * zEff));
        canvas.width = cw;
        canvas.height = ch;
        canvas.style.display = 'block';
        placeholder.style.display = 'none';
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, cw, ch);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        try {
          var bmpTop = imgStripTop;
          var bmpBot = imgStripTop + dh;
          var o0 = Math.max(y0, bmpTop);
          var o1 = Math.min(y1, bmpBot);
          if (o1 > o0 && sliceH > 1e-6) {
            var syF = ((o0 - bmpTop) / dh) * ny;
            var shF = ((o1 - o0) / dh) * ny;
            var sy = Math.max(0, Math.min(ny - 1, Math.floor(syF)));
            var sh = Math.max(1, Math.min(ny - sy, Math.ceil(shF)));
            if (sy + sh > ny) sh = ny - sy;
            var destY = ((o0 - y0) / sliceH) * ch;
            var destH = ((o1 - o0) / sliceH) * ch;
            destY = Math.max(0, Math.round(destY));
            destH = Math.max(1, Math.round(destH));
            if (destY + destH > ch) destH = ch - destY;
            ctx.drawImage(stripBitmap, sx, sy, sw, sh, 0, destY, cw, destH);
          }
        } catch (e) {
          console.warn('[UITLIJN] drawImage:', e);
          drawDetailError('Tekenen mislukt.\nControleer of de scanlint geladen is.');
          finishScroll(cw / 2, ch / 2);
          return;
        }

        var scaleX = cw / w;
        var scaleY = ch / sliceH;

        /* Andere frames die in dit verticale venster vallen: zachte omlijning */
        for (var ri = 0; ri < p.gridRects.length; ri++) {
          var rO = p.gridRects[ri];
          var rfn = rO.frameNumber != null ? rO.frameNumber : ri + 1;
          if (rfn === fn) continue;
          var ry0 = Number(rO.y) || 0;
          var rhO = Math.max(1, Number(rO.height) || 1);
          if (ry0 + rhO <= y0 || ry0 >= y1) continue;
          var rx = Number(rO.x) || 0;
          var rwO = Math.max(1, Number(rO.width) || 1);
          var xlO = rx * scaleX;
          var xrO = (rx + rwO) * scaleX;
          var ytO = (Math.max(y0, ry0) - y0) * scaleY;
          var ybO = (Math.min(y1, ry0 + rhO) - y0) * scaleY;
          /* Duidelijk zichtbaar maar stiller dan het gekozen frame (rood/groen dik). */
          ctx.strokeStyle = 'rgba(0, 240, 110, 0.72)';
          ctx.lineWidth = Math.max(2, zEff * 0.85);
          ctx.strokeRect(xlO, ytO, Math.max(0, xrO - xlO), Math.max(0, ybO - ytO));
          /* Framenummer op elk zichtbaar buurframe (groene cellen). */
          var cwF = Math.abs(xrO - xlO);
          var chF = Math.abs(ybO - ytO);
          if (cwF >= 6 && chF >= 8) {
            var fsN = Math.max(7, Math.min(20, Math.round(9 * zEff / 2)));
            var cxN = (xlO + xrO) / 2;
            var cyN = (ytO + ybO) / 2;
            ctx.font = 'bold ' + fsN + 'px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = Math.max(2, zEff * 0.45);
            ctx.strokeStyle = 'rgba(0,0,0,0.88)';
            ctx.strokeText(String(rfn), cxN, cyN);
            ctx.fillStyle = 'rgba(255,255,255,0.96)';
            ctx.fillText(String(rfn), cxN, cyN);
          }
        }

        var xL = gx * scaleX;
        var xR = (gx + grw) * scaleX;
        var frameTopLocal = gy - y0;
        var frameBotLocal = Math.min(sliceH, gy + grh - y0);
        var yT = Math.max(0, frameTopLocal) * scaleY;
        var yB = Math.max(yT, frameBotLocal * scaleY);

        var activeNum = p.activeFrameNumber != null ? p.activeFrameNumber : (p.activeFrameIndex != null ? p.activeFrameIndex + 1 : 1);
        var isActive = fn === activeNum;
        var lineW = Math.max(1, zEff * 0.75);
        var lineWEmph = isActive ? Math.max(2, lineW * 1.6) : lineW;
        var strokeMain = isActive ? 'rgb(255, 60, 60)' : 'rgb(0, 255, 100)';

        /* Alleen binnen het gekozen frame (niet volle canvas-hoogte — anders rode lijnen over alle buren). */
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineWEmph;
        ctx.beginPath();
        ctx.moveTo(xL, yT);
        ctx.lineTo(xL, yB);
        ctx.moveTo(xR, yT);
        ctx.lineTo(xR, yB);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(xL, yT);
        ctx.lineTo(xR, yT);
        ctx.moveTo(xL, yB);
        ctx.lineTo(xR, yB);
        ctx.stroke();

        var ref = refLineDisplayFromPayload(p);
        if (ref && Number.isFinite(ref.y) && ref.y >= y0 && ref.y <= y1) {
          var ry = ((ref.y - y0) / sliceH) * ch;
          ctx.strokeStyle = 'rgba(255, 220, 0, 0.95)';
          ctx.lineWidth = Math.max(1, zEff);
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(0, ry);
          ctx.lineTo(cw, ry);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        var fs = Math.max(10, Math.min(22, Math.round(11 * zEff / 2)));
        ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var cx = (xL + xR) / 2;
        var cy = (yT + yB) / 2;
        if (xR > xL + 4 && yB > yT + 4) {
          ctx.lineWidth = Math.max(2, zEff * 0.5);
          ctx.strokeStyle = 'rgba(0,0,0,0.82)';
          ctx.strokeText(String(fn), cx, cy);
          ctx.fillStyle = isActive ? 'rgba(255,85,85,0.98)' : 'rgba(255,255,255,0.95)';
          ctx.fillText(String(fn), cx, cy);
        }

        finishScroll(cx, cy);
      }

      function applyPayload(payload) {
        lastPayload = payload;
        if (!payload) {
          lastAlignStripDataUrl = '';
          try { stripBitmap.src = ''; } catch (e) {}
          updateHeaderFilename(null);
          placeholder.style.display = 'block';
          canvas.style.display = 'none';
          if (selFrame) selFrame.innerHTML = '';
          return;
        }
        updateHeaderFilename(payload);
        if (payload.gridRects && payload.gridRects.length > 0) {
          syncFrameOptions(payload);
        }
        if (payload.stripDataUrl) {
          if (payload.stripDataUrl === lastAlignStripDataUrl) {
            requestAnimationFrame(function () {
              if (stripBitmap.complete && stripBitmap.naturalWidth > 0) drawDetailFrame();
            });
          } else {
            lastAlignStripDataUrl = payload.stripDataUrl;
            var onDecoded = function () {
              requestAnimationFrame(drawDetailFrame);
            };
            stripBitmap.onerror = function () {
              stripBitmap.onerror = null;
              stripBitmap.onload = null;
              drawDetailError('Afbeelding laden mislukt.\nSluit UITLIJN en open opnieuw, of wissel even van scanlint.');
            };
            stripBitmap.onload = function () {
              stripBitmap.onload = null;
              stripBitmap.onerror = null;
              if (typeof stripBitmap.decode === 'function') {
                stripBitmap.decode().then(onDecoded).catch(onDecoded);
              } else {
                onDecoded();
              }
            };
            stripBitmap.src = payload.stripDataUrl;
            if (stripBitmap.complete && stripBitmap.naturalWidth > 0) {
              stripBitmap.onload = null;
              stripBitmap.onerror = null;
              if (typeof stripBitmap.decode === 'function') {
                stripBitmap.decode().then(onDecoded).catch(onDecoded);
              } else {
                onDecoded();
              }
            }
          }
        } else if (payload.gridRects && payload.gridRects.length > 0 && stripBitmap.src) {
          requestAnimationFrame(function () {
            if (stripBitmap.complete && stripBitmap.naturalWidth > 0) drawDetailFrame();
          });
        }
        if (!payload.stripDataUrl && (!payload.gridRects || payload.gridRects.length === 0)) {
          placeholder.style.display = 'block';
          canvas.style.display = 'none';
        }
      }

      loadPrefs();
      api.onAlignPreviewUpdate(applyPayload);

      if (selFrame) {
        selFrame.addEventListener('change', function () {
          savePrefs();
          if (api.setActiveFrameByNumber) {
            var fn = parseInt(selFrame.value, 10);
            if (Number.isFinite(fn) && fn >= 1) api.setActiveFrameByNumber(fn);
          }
          drawDetailFrame();
        });
      }
      if (selZoom) {
        selZoom.addEventListener('change', function () {
          savePrefs();
          drawDetailFrame();
        });
      }
      if (chkLockScroll) {
        chkLockScroll.addEventListener('change', function () {
          savePrefs();
        });
      }

      var btnAlignRefresh = document.getElementById('btn-align-refresh');
      if (btnAlignRefresh && api.requestAlignPreviewRefresh) {
        btnAlignRefresh.addEventListener('click', function () {
          api.requestAlignPreviewRefresh();
        });
      }
      if (api.requestAlignPreviewRefresh) {
        setTimeout(function () { api.requestAlignPreviewRefresh(); }, 120);
        setTimeout(function () { api.requestAlignPreviewRefresh(); }, 600);
      }
        return true;
      }

      function tryAttachAlignPreview() {
        return attachAlignPreview(window.alignPreviewApi);
      }

      function scheduleAlignPreviewInit() {
        if (tryAttachAlignPreview()) return;
        var n = 0;
        var id = setInterval(function () {
          if (tryAttachAlignPreview()) {
            clearInterval(id);
            return;
          }
          if (++n >= 200) {
            clearInterval(id);
            var ph = document.getElementById('align-placeholder');
            if (ph) {
              ph.textContent =
                'Kan UITLIJN niet starten (geen verbinding met de app). Sluit dit venster en open opnieuw via Scanlint → Uitlijning…';
              ph.style.color = '#e07070';
            }
          }
        }, 25);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scheduleAlignPreviewInit);
      } else {
        scheduleAlignPreviewInit();
      }
    })();
  </script>
</body>
</html>
