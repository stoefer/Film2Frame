      function macroNormalizeLoops() {

        var v = inputMacroLoopDelay ? parseInt(inputMacroLoopDelay.value, 10) : 700;

        v = Math.max(0, Math.min(10000, v));

      function macroNormalizeSpeed() {
        var v = selectMacroSpeed ? Number(selectMacroSpeed.value) : 1;

      function isMacroSafetyProfileActive(speed) {

        var loopDelay = getMacroLoopDelayValue();

      }

        var s = Number.isFinite(Number(speed)) ? Number(speed) : 1;

        if (btnMacroSpeedFast) btnMacroSpeedFast.classList.toggle('btn-active', Math.abs(s - 1.5) < 0.001);

      function macroScaleDelay(ms, speedFactor) {
        var m = Math.max(0, Math.round(Number(ms) || 0));
        var sf = Number.isFinite(Number(speedFactor)) && Number(speedFactor) > 0 ? Number(speedFactor) : 1;
        if (m <= 0) return 0;
        return Math.max(20, Math.round(m / sf));
      }

      function clampAssistExtraPx(v) {

      function clampAssistOffsetSigned(v) {
        var n = Math.round(Number(v) || 0);
        return Math.max(-400, Math.min(400, n));
      }

      function getAssistOffsetValuesFromExtraValues(values) {
        var left = clampAssistExtraPx(values && values.left);
        var right = clampAssistExtraPx(values && values.right);
        var top = clampAssistExtraPx(values && values.top);
        var bottom = clampAssistExtraPx(values && values.bottom);
        return {
          x: clampAssistOffsetSigned(left - right),
          y: clampAssistOffsetSigned(top - bottom)
        };
      }

      function applyAssistOffsetInputsFromExtraValues(values) {

      function extraValuesFromSignedOffsets(x, y) {
        var ox = clampAssistOffsetSigned(x);
        var oy = clampAssistOffsetSigned(y);
        return {
          left: ox > 0 ? ox : 0,
          right: ox < 0 ? -ox : 0,
          top: oy > 0 ? oy : 0,
          bottom: oy < 0 ? -oy : 0
        };
      }

      function getAssistExtraValues() {
        return {
          left: clampAssistExtraPx(inputAutoRasterAssistExtraLeft ? inputAutoRasterAssistExtraLeft.value : 0),
          right: clampAssistExtraPx(inputAutoRasterAssistExtraRight ? inputAutoRasterAssistExtraRight.value : 0),

        };

        if (btnAssistExtraPresetOffsetZero) btnAssistExtraPresetOffsetZero.classList.toggle('btn-active', off.x === 0 && off.y === 0);
        if (btnAssistExtraPresetLeft2) btnAssistExtraPresetLeft2.classList.toggle('btn-active', v.left === 2 && v.right === 0 && v.top === 0 && v.bottom === 0);
        if (btnAssistExtraPresetLeft4) btnAssistExtraPresetLeft4.classList.toggle('btn-active', v.left === 4 && v.right === 0 && v.top === 0 && v.bottom === 0);
        if (btnAssistExtraPresetFrame) btnAssistExtraPresetFrame.classList.toggle('btn-active', v.left === 2 && v.right === 2 && v.top === 1 && v.bottom === 1);

      /** Toon alleen assist-velden die bij de gekozen preset horen. */
      function assistFieldMatchesPreset(group, preset) {
        var p = preset || '';
        var isSprocket = p === 'sprocket-left' || p === 'sprocket-right';
        var isDark = p === 'black-line' || p === 'black-line-left';
        var isLeftWhite = p === 'left-white';
        if (group === 'dark-line') return isDark;
        if (group === 'edge-search') return !isSprocket;
        if (group === 'sprocket') return isSprocket;
        if (group === 'left-white') return isLeftWhite;
        // X-ref niet bij perforatie (freezeX) of zwarte-lijn (X-lock)
        if (group === 'x-ref') return !isSprocket && !isDark;
        if (group === 'y-ref') return !isSprocket;
        // Center eerst wordt bij perforatie overgeslagen
        if (group === 'center-first') return !isSprocket;
        return true;
      }

      function updateAssistFieldsForPreset(preset) {
        var p = preset || (selectAutoRasterAssistPreset ? selectAutoRasterAssistPreset.value : '') || '';
        var root = document.querySelector('.toolbar-controls-right');
        if (!root) return;
        var nodes = root.querySelectorAll('[data-assist-for]');
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          var group = el.getAttribute('data-assist-for') || '';
          var show = assistFieldMatchesPreset(group, p);
          el.classList.toggle('assist-field-hidden', !show);
        }
        // Lege rijen inklappen (alleen children met data-assist-for of mix)
        var rows = root.querySelectorAll('.assist-row--extra, .assist-row--extra-advanced');
        for (var r = 0; r < rows.length; r++) {
          var row = rows[r];
          var kids = row.children;
          var anyVisible = false;
          for (var k = 0; k < kids.length; k++) {
            if (!kids[k].classList.contains('assist-field-hidden')) {
              anyVisible = true;
              break;
            }
          }
          row.classList.toggle('assist-row-hidden', !anyVisible);
        }

        var eqX = Math.max(v.left, v.right);
        var eqY = Math.max(v.top, v.bottom);
        applyAssistExtraValues(
          { left: eqX, right: eqX, top: eqY, bottom: eqY },

          stripTr('stripWindow.autoAssistExtraPresetOffsetZero')

      function applyAssistExtraValues(values, recordMacro, label) {
        var left = clampAssistExtraPx(values && values.left);

        var top = clampAssistExtraPx(values && values.top);
        var bottom = clampAssistExtraPx(values && values.bottom);
        if (inputAutoRasterAssistExtraLeft) inputAutoRasterAssistExtraLeft.value = String(left);
        if (inputAutoRasterAssistExtraRight) inputAutoRasterAssistExtraRight.value = String(right);

        if (inputAutoRasterAssistExtraBottom) inputAutoRasterAssistExtraBottom.value = String(bottom);

        if (api.setAutoRasterAssistExtraRightPx) api.setAutoRasterAssistExtraRightPx(right);
        if (api.setAutoRasterAssistExtraTopPx) api.setAutoRasterAssistExtraTopPx(top);
        if (api.setAutoRasterAssistExtraBottomPx) api.setAutoRasterAssistExtraBottomPx(bottom);
        applyAssistOffsetInputsFromExtraValues({ left: left, right: right, top: top, bottom: bottom });

          macroRecordStep({

      function getCurrentScanIndex() {
        if (!lastPayload) return null;
        var idx = lastPayload.projectScanIndex != null ? Math.floor(Number(lastPayload.projectScanIndex)) : NaN;
        return Number.isFinite(idx) && idx >= 1 ? idx : null;
      }

      function getCurrentLintName() {
        if (!lastPayload) return null;
        var nm = lastPayload.lintFileName != null ? String(lastPayload.lintFileName).trim() : '';
        return nm || null;
      }

      function payloadLooksReadyForDetect() {
        if (!lastPayload || typeof lastPayload !== 'object') return false;
        if (!Array.isArray(lastPayload.gridRects) || lastPayload.gridRects.length < 1) return false;
        if (!lastPayload.stripDataUrl || typeof lastPayload.stripDataUrl !== 'string') return false;
        return true;
      }

      async function waitForScanIndexChange(prevIdx, timeoutMs) {
        var maxWait = Math.max(200, Number(timeoutMs) || 1200);
        var start = Date.now();
        while (Date.now() - start < maxWait) {
          var cur = getCurrentScanIndex();
          if (cur != null && prevIdx != null && cur !== prevIdx) return true;
          await macroSleep(60);
        }
        return false;
      }

      async function waitForScanReadyAfterNav(prevIdx, prevLintName, timeoutMs) {
        var maxWait = Math.max(600, Number(timeoutMs) || 8000);
        var start = Date.now();
        while (Date.now() - start < maxWait) {
          var curIdx = getCurrentScanIndex();
          var curName = getCurrentLintName();
          var idxChanged = curIdx != null && prevIdx != null && curIdx !== prevIdx;
          var nameChanged = !!curName && !!prevLintName && curName !== prevLintName;
          var becameReady = payloadLooksReadyForDetect();
          if ((idxChanged || nameChanged) && becameReady) return true;
          await macroSleep(70);
        }
        return false;
      }

      async function waitForScanReadyAfterNavWithRetry(prevIdx, prevLintName, timeoutMs, retries) {
        var base = Math.max(1200, Number(timeoutMs) || 18000);
        var attempts = Math.max(1, Math.min(5, Math.round(Number(retries) || 2)));
        for (var a = 0; a < attempts; a++) {
          var attemptTimeout = Math.round(base * (1 + a * 0.6));
          if (await waitForScanReadyAfterNav(prevIdx, prevLintName, attemptTimeout)) return true;
          // Geef renderer/main even extra ruimte bij trage export/schijf.
          await macroSleep(180 + a * 120);
        }
        return false;
      }

      function macroGetRemainingLoops() {
        if (!lastPayload) return 1;
        var idx = lastPayload.projectScanIndex != null ? Math.floor(Number(lastPayload.projectScanIndex)) : NaN;
        var total = lastPayload.projectScanCount != null ? Math.floor(Number(lastPayload.projectScanCount)) : NaN;
        if (!Number.isFinite(idx) || !Number.isFinite(total) || idx < 1 || total < 1) return 1;
        return Math.max(1, total - idx + 1);
      }

      function macroStepLabel(step) {
        if (!step || typeof step !== 'object') return '…';
        if (step.label) return String(step.label);
        var t = step.type || 'actie';

          btnMacroPlay.disabled = macroState.steps.length < 1;

        if (btnMacroSave) btnMacroSave.disabled = macroState.playing || macroState.steps.length < 1;
        if (btnMacroLoad) btnMacroLoad.disabled = macroState.playing;
        if (btnMacroClear) btnMacroClear.disabled = macroState.recording || macroState.playing || macroState.steps.length < 1;
        if (inputMacroLoops) inputMacroLoops.disabled = macroState.playing || (chkMacroRemaining && chkMacroRemaining.checked);
        if (selectMacroSpeed) selectMacroSpeed.disabled = macroState.playing;
        if (btnMacroSpeedSafe) btnMacroSpeedSafe.disabled = macroState.playing;
        if (btnMacroSpeedNormal) btnMacroSpeedNormal.disabled = macroState.playing;
        if (btnMacroSpeedFast) btnMacroSpeedFast.disabled = macroState.playing;

        if (chkMacroRemaining) chkMacroRemaining.disabled = macroState.playing;
        updateMacroSpeedPresetUi(macroNormalizeSpeed());
        if (macroPreviewEl) {
          if (macroState.steps.length < 1) {
            macroPreviewEl.textContent = stripTr('stripWindow.macroEmpty');
          } else {

      function isAutoAdvanceActive() {

      function stopAllProgress() {
        var stopped = false;
        if (macroState.playing) {
          macroState.cancelPlay = true;

          stopped = true;
        }
        if (isAutoAdvanceActive()) {
          if (chkAutoAdvanceAlign) chkAutoAdvanceAlign.checked = false;
          var labAdv = chkAutoAdvanceAlign && chkAutoAdvanceAlign.closest('label');
          if (labAdv) labAdv.classList.remove('is-active');
          if (api.stopAutoAdvanceAfterAlign) api.stopAutoAdvanceAfterAlign();
          else if (api.setAutoAdvanceAfterAlign) api.setAutoAdvanceAfterAlign(false);
          stopped = true;
        }
        if (stopped) {
          if (api.sendStatus) api.sendStatus(0, stripTr('stripWindow.stopProgressStopped'));
        }
        updateStopProgressUi();
        return stopped;
      }

      function setMacroStatus(text) {
        if (!macroStatusEl) return;
        macroStatusEl.textContent = text || '';
      }

      function macroRecordStep(step) {
        if (!macroState.recording || macroState.playing || !step) return;
        var now = Date.now();
        var delayMs = 0;
        if (macroState.steps.length > 0 && macroState.lastRecordedAt > 0) {
          delayMs = now - macroState.lastRecordedAt;
          if (!Number.isFinite(delayMs) || delayMs < 0) delayMs = 0;
          delayMs = Math.max(0, Math.min(8000, Math.round(delayMs)));
        }
        macroState.lastRecordedAt = now;
        var entry = Object.assign({}, step, { delayMs: delayMs });
        macroState.steps.push(entry);
        setMacroStatus(stripTrFmt('stripWindow.macroStatusRecordingCount', { count: macroState.steps.length }));
        updateMacroUi();
      }

      function exportMacroObject() {
        return {
          name: 'Raster assist macro',
          steps: Array.isArray(macroState.steps) ? macroState.steps.slice() : []
        };
      }

      function macroFileToken(v, fallback) {
        var raw = v == null ? '' : String(v).trim().toLowerCase();
        var safe = raw
          .replace(/[/\\:*?"<>|]+/g, '-')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
        if (!safe) return fallback || 'x';
        return safe.slice(0, 28);
      }

      function macroDateToken() {
        var d = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        return (
          String(d.getFullYear()) +
          pad(d.getMonth() + 1) +
          pad(d.getDate()) +
          '-' +
          pad(d.getHours()) +
          pad(d.getMinutes())
        );
      }

      function buildSuggestedMacroFileName() {
        var film = 'film';
        if (lastPayload && lastPayload.scanInfo && lastPayload.scanInfo.filmFormat) {
          film = macroFileToken(lastPayload.scanInfo.filmFormat, 'film');
        }
        var preset = macroFileToken(
          selectAutoRasterAssistPreset ? selectAutoRasterAssistPreset.value : 'bottom-v1',
          'preset'
        );
        return 'raster-macro-' + film + '-' + preset + '-' + macroDateToken();
      }

      function importMacroObject(macro) {
        if (!macro || typeof macro !== 'object') return false;
        const steps = Array.isArray(macro.steps)
          ? macro.steps
              .filter(function (s) { return s && typeof s === 'object' && typeof s.type === 'string'; })
              .map(function (s, i) {
                var d = Math.round(Number(s.delayMs));
                if (!Number.isFinite(d) || d < 0) d = i === 0 ? 0 : 120;
                return Object.assign({}, s, { delayMs: Math.max(0, Math.min(8000, d)) });
              })
          : [];
        if (steps.length < 1) return false;
        macroState.recording = false;
        macroState.lastRecordedAt = 0;
        macroState.steps = steps;
        return true;
      }

      async function runAutoDetectBounds(recordMacro) {
        if (!api.autoDetectFrameBounds) return;
        setBusy(true);
        // Laat busy-cursor + events even door (detect is synchroon zwaar)
        await new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });
        try {
          await Promise.resolve(api.autoDetectFrameBounds());
        } catch (_) {}
        // Geen foutmelding bij badScan — Auto ▶ stopt stil indien actief

              inputAutoRasterDarkLineStrongScale.value = String(darkStrongScale);

          case 'scanNext':

            var prevNameN = getCurrentLintName();
            runNavigateScan('next', true, false);
            if (!(await waitForScanReadyAfterNavWithRetry(prevN, prevNameN, 18000, 3))) {
              setBusy(false);
              setMacroStatus('Macro warning: scan-next-timeout, ga verder');
              await macroSleep(macroScaleDelay(600, sf));

            return;
          case 'scanPrev':

            var prevNameP = getCurrentLintName();
            runNavigateScan('prev', false, false);
            if (!(await waitForScanReadyAfterNavWithRetry(prevP, prevNameP, 14000, 3))) {
              setBusy(false);
              setMacroStatus('Macro warning: scan-prev-timeout, ga verder');
              await macroSleep(macroScaleDelay(600, sf));
            }
            return;
          case 'scanNav':
            var dir = step.direction === 'prev' ? 'prev' : 'next';
            var exp = dir === 'next' && !!step.exportCurrent;
            var prevSN = getCurrentScanIndex();
            var prevNameSN = getCurrentLintName();
            runNavigateScan(dir, exp, false);
            if (!(await waitForScanReadyAfterNavWithRetry(prevSN, prevNameSN, exp ? 18000 : 14000, 3))) {
              setBusy(false);
              setMacroStatus('Macro warning: scan-nav-timeout, ga verder');
              await macroSleep(macroScaleDelay(600, sf));
            }
            return;
          case 'scanGoto':
            if (api.gotoProjectScan) {
              setBusy(true);
              var gi = parseInt(step.index, 10);
              if (!Number.isFinite(gi) || gi < 1) gi = 1;
              var prevG = getCurrentScanIndex();
              var prevNameG = getCurrentLintName();
              api.gotoProjectScan({ index: gi, exportCurrent: true });
              if (!(await waitForScanReadyAfterNavWithRetry(prevG, prevNameG, 18000, 3))) {
                setBusy(false);
                setMacroStatus('Macro warning: scan-goto-timeout, ga verder');
                await macroSleep(macroScaleDelay(700, sf));

            return;

              api.sendGridOffsetDelta(Number(step.dx) || 0, Number(step.dy) || 0, 'hand');
              setBusy(true);
              await macroSleep(macroScaleDelay(100, sf));
            }
            return;
          case 'widthEdge':
            if (!fixResolutionLocked && api.applyWidthEdge) {
              api.applyWidthEdge(step.edge === 'right' ? 'right' : 'left', Number(step.delta) || 0);
              setBusy(true);
              await macroSleep(macroScaleDelay(100, sf));

            return;
          case 'heightEdge':
            if (!fixResolutionLocked && api.applyHeightEdge) {
              api.applyHeightEdge(step.edge === 'bottom' ? 'bottom' : 'top', Number(step.delta) || 0);
              setBusy(true);

            return;
          case 'absolute':
            if (api.setGridOffsetAbsolute) {
              var ax = Math.round(Number(step.x) || 0);
              var ay = Math.round(Number(step.y) || 0);
              var ayb = Math.round(Number(step.yBottom) || 0);
              if (inputX) inputX.value = String(ax);
              if (inputY) inputY.value = String(ay);
              if (inputYBottom) inputYBottom.value = String(ayb);
              api.setGridOffsetAbsolute(ax, ay, ayb);
              setBusy(true);
              await macroSleep(macroScaleDelay(120, sf));
            }
            return;
          case 'jump':
            if (api.jumpTo) {
              var pos = step.position === 'top' || step.position === 'bottom' ? step.position : 'middle';
              activeJump = pos;
              pendingJumpScroll = true;
              updateActiveButtons();
              setBusy(true);
              api.jumpTo(pos);
              await macroSleep(macroScaleDelay(120, sf));
            }
            return;
          case 'resetGrid':
            if (api.resetGridToDefault) {
              setBusy(true);
              api.resetGridToDefault();
              await macroSleep(macroScaleDelay(140, sf));
            }
            return;
          case 'fixResolution':
            if (api.setFixResolutionLocked) {
              var nextFix = !!step.value;
              api.setFixResolutionLocked(nextFix);
              fixResolutionLocked = nextFix;
              updateFixResolutionUi();
              await macroSleep(macroScaleDelay(100, sf));
            }
            return;
          case 'verticalStep':
            if (!fixResolutionLocked && api.applyVerticalFixedBottomStep) {
              var vv = Math.max(1, Math.round(Number(step.step) || 1));
              api.applyVerticalFixedBottomStep(vv, step.kind === 'stretch' ? 'stretch' : 'compress');
              setBusy(true);
              await macroSleep(macroScaleDelay(120, sf));
            }
            return;
          case 'verticalBoundary':
            if (!fixResolutionLocked && api.applyVerticalRigidPanBoundary) {
              api.applyVerticalRigidPanBoundary(!!step.towardCompress);
              setBusy(true);
              await macroSleep(macroScaleDelay(120, sf));
            }
            return;
          default:
            return;
        }
      }

      async function playMacro() {
        if (macroState.playing) return;
        if (macroState.steps.length < 1) {
          setMacroStatus(stripTr('stripWindow.macroStatusNoSteps'));
          updateMacroUi();
          return;
        }
        if (macroState.recording) {
          macroState.recording = false;
        }
        var loops = chkMacroRemaining && chkMacroRemaining.checked ? macroGetRemainingLoops() : macroNormalizeLoops();
        var speedFactor = macroNormalizeSpeed();
        var loopDelayMs = macroNormalizeLoopDelay();
        loops = Math.max(1, loops);
        macroState.playing = true;
        macroState.cancelPlay = false;
        updateMacroUi();
        var playStartedAt = Date.now();
        var maxPlayMs = 6 * 60 * 60 * 1000; // safety cap: 6h
        try {
          for (var i = 0; i < loops; i++) {
            if (macroState.cancelPlay) break;
            if ((Date.now() - playStartedAt) > maxPlayMs) {
              macroState.cancelPlay = true;
              setMacroStatus('Macro safety stop: time cap reached');
              break;
            }
            setMacroStatus(stripTrFmt('stripWindow.macroStatusPlayingLoop', { current: i + 1, total: loops }));
            for (var j = 0; j < macroState.steps.length; j++) {
              if (macroState.cancelPlay) break;
              var stepDelay = Math.round(Number(macroState.steps[j] && macroState.steps[j].delayMs));
              if (!Number.isFinite(stepDelay) || stepDelay < 0) stepDelay = 0;
              stepDelay = Math.max(0, Math.min(8000, stepDelay));
              var scaledStepDelay = macroScaleDelay(stepDelay, speedFactor);
              if (scaledStepDelay > 0) await macroSleep(scaledStepDelay);
              try {
                await macroRunStep(macroState.steps[j], speedFactor);
              } catch (err) {
                macroState.cancelPlay = true;
                var msg = err && err.message ? String(err.message) : String(err || 'macro-step-failed');
                setMacroStatus('Macro stopped: ' + msg);
                break;
              }
            }
            if (!macroState.cancelPlay && i < loops - 1) {
              var scaledLoopDelay = macroScaleDelay(loopDelayMs, speedFactor);
              setMacroStatus(stripTrFmt('stripWindow.macroStatusLoopDelay', { ms: scaledLoopDelay, next: i + 2, total: loops }));
              await macroSleep(scaledLoopDelay);
            }
          }
        } catch (err) {
          macroState.cancelPlay = true;
          var fatalMsg = err && err.message ? String(err.message) : String(err || 'macro-failed');
          setMacroStatus('Macro error: ' + fatalMsg);
        } finally {
          setBusy(false);
          if (macroState.cancelPlay) setMacroStatus(stripTr('stripWindow.macroStatusStopped'));
          else setMacroStatus(stripTr('stripWindow.macroStatusDone'));
          macroState.playing = false;
          macroState.cancelPlay = false;
          updateMacroUi();
        }
      }

      function toggleMacroRecording() {
        if (macroState.playing) return;
        macroState.recording = !macroState.recording;
        if (macroState.recording) {
          macroState.lastRecordedAt = Date.now();
          setMacroStatus(stripTr('stripWindow.macroStatusRecording'));
        }
        else setMacroStatus(stripTrFmt('stripWindow.macroStatusReadyCount', { count: macroState.steps.length }));
        updateMacroUi();
      }

        macroState.recording = false;
        macroState.lastRecordedAt = 0;
        macroState.steps = [];
        setMacroStatus(stripTr('stripWindow.macroStatusCleared'));
        updateMacroUi();
      }

            ? String(lastPayload.scanInfo.filmFormat).trim()
            : '';
        return ff || 'default';
      }

      function loadGridSizeByFilmMap() {
        try {
          const raw = window.localStorage.getItem(GRID_SIZE_BY_FILM_STORAGE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function saveGridSizeByFilmMap(map) {
        try {
          window.localStorage.setItem(GRID_SIZE_BY_FILM_STORAGE_KEY, JSON.stringify(map || {}));
        } catch (_) {}
      }

      function saveCurrentGridSizeForFilm() {
        var w = parseInt(inputGridWidthPx && inputGridWidthPx.value, 10);
        var h = parseInt(inputGridHeightPx && inputGridHeightPx.value, 10);
        if (!Number.isFinite(w) || w < 1 || !Number.isFinite(h) || h < 1) {
          alert(stripTr('stripWindow.gridSizeInvalidAlert'));
          return;
        }
        const filmKey = getCurrentFilmFormatKey();
        const map = loadGridSizeByFilmMap();
        map[filmKey] = {
          width: Math.max(1, Math.round(w)),
          height: Math.max(1, Math.round(h)),
          updatedAt: Date.now()
        };
        saveGridSizeByFilmMap(map);
        setMacroStatus(
          stripTrFmt('stripWindow.gridSizeFilmSaved', {
            film: filmKey,
            width: map[filmKey].width,
            height: map[filmKey].height
          })
        );
      }

      function loadSavedGridSizeForFilm(applyAfterLoad) {
        const filmKey = getCurrentFilmFormatKey();
        const map = loadGridSizeByFilmMap();
        const rec = map && typeof map[filmKey] === 'object' ? map[filmKey] : null;
        if (!rec) {
          setMacroStatus(stripTrFmt('stripWindow.gridSizeFilmNotFound', { film: filmKey }));
          return false;
        }
        const w = Math.max(1, Math.round(Number(rec.width) || 0));
        const h = Math.max(1, Math.round(Number(rec.height) || 0));
        if (!Number.isFinite(w) || !Number.isFinite(h) || w < 1 || h < 1) {
          setMacroStatus(stripTrFmt('stripWindow.gridSizeFilmNotFound', { film: filmKey }));
          return false;
        }
        if (inputGridWidthPx) inputGridWidthPx.value = String(w);
        if (inputGridHeightPx) inputGridHeightPx.value = String(h);
        setMacroStatus(stripTrFmt('stripWindow.gridSizeFilmLoaded', { film: filmKey, width: w, height: h }));
        if (applyAfterLoad) applyGridSizePx();
        return true;
      }

      function updateHeaderFilename(p) {
        if (!headerFilenameEl) return;
        var raw = p && p.lintFileName != null ? String(p.lintFileName).trim() : '';
        if (!raw) {
          headerFilenameEl.textContent = '—';
          headerFilenameEl.title = '';
        } else {
          headerFilenameEl.textContent = raw;
          headerFilenameEl.title = raw;
        }
      }

      function refLineDisplayFromPayload(p) {
        const gr = p.gridRects;
        if (!gr || gr.length === 0) return null;
        const n = gr.length;
        var k = p.verticalAnchorCustomK != null ? Math.round(Number(p.verticalAnchorCustomK)) : n;
        if (!Number.isFinite(k)) k = n;
        k = Math.max(0, Math.min(n, k));
        const r0 = gr[0];
        var x0 = Number(r0.x) || 0;
        var w0 = Math.max(0, Number(r0.width) || 0);
        if (w0 <= 0) return null;
        var yLine;
        if (k <= 0) yLine = Number(r0.y) || 0;
        else if (k >= n) {
          var last = gr[n - 1];
          yLine = (Number(last.y) || 0) + Math.max(0, Number(last.height) || 0);
        } else {
          var r = gr[k];
          yLine = Number(r.y) || 0;
        }
        return { y: yLine, x0: x0, w: w0 };
      }

      var searchRangeGuideFocus = false;
      var searchRangeGuideHideTimer = null;

      function isSearchRangeGuideVisible() {
        if (chkShowSearchRangeGuide && chkShowSearchRangeGuide.checked) return true;
        return !!searchRangeGuideFocus;
      }

      function getLiveSearchRangeCanvasPx() {
        var fromInput = inputAutoRasterDarkLineSearchRange
          ? Math.round(Number(inputAutoRasterDarkLineSearchRange.value))
          : NaN;
        if (Number.isFinite(fromInput)) return Math.max(20, Math.min(300, fromInput));
        if (lastPayload && lastPayload.autoRasterDarkLineSearchRangePx != null) {
          return Math.max(20, Math.min(300, Math.round(Number(lastPayload.autoRasterDarkLineSearchRangePx) || 160)));
        }
        return 160;
      }

      function shouldDrawSearchRangeGuideForPreset(preset) {
        var p = String(preset || '').toLowerCase();
        return p !== 'sprocket-left' && p !== 'sprocket-right';
      }

      /**
       * Overlay: zoekbereik ±px rond actief frame (canvas-px → display via stripScale).
       * Geldt voor zwarte-lijn én andere edge-presets (L/R + Boven/Onder).
       */
      function drawSearchRangeGuide(ctx, p, zoom) {
        if (!ctx || !p || !isSearchRangeGuideVisible()) return;
        var preset = (selectAutoRasterAssistPreset && selectAutoRasterAssistPreset.value) || p.autoRasterAssistPreset || '';
        if (!shouldDrawSearchRangeGuideForPreset(preset)) return;
        var activeNum = p.activeFrameNumber != null ? p.activeFrameNumber : (p.activeFrameIndex != null ? p.activeFrameIndex + 1 : 1);
        var rect = null;
        if (Array.isArray(p.gridRects)) {
          for (var i = 0; i < p.gridRects.length; i++) {
            if (p.gridRects[i].frameNumber === activeNum) {
              rect = p.gridRects[i];
              break;
            }
          }
          if (!rect) rect = p.gridRects[0];
        }
        if (!rect && p.gridRect) rect = p.gridRect;
        if (!rect) return;
        var x = Number(rect.x) || 0;
        var y = Number(rect.y) || 0;
        var rw = Math.max(1, Number(rect.width) || 0);
        var rh = Math.max(1, Number(rect.height) || 0);
        var scale = Number(p.stripScale);
        if (!Number.isFinite(scale) || scale <= 0) scale = 1;
        var rangeCanvas = getLiveSearchRangeCanvasPx();
        var r = Math.max(1, rangeCanvas * scale);
        var W = Math.max(1, p.displayWidth || 1);
        var H = Math.max(1, p.extendedDisplayHeight || p.displayHeight || 1);
        var ox = Math.max(0, x - r);
        var oy = Math.max(0, y - r);
        var oRight = Math.min(W, x + rw + r);
        var oBottom = Math.min(H, y + rh + r);
        var ow = Math.max(1, oRight - ox);
        var oh = Math.max(1, oBottom - oy);
        ctx.save();
        ctx.fillStyle = 'rgba(80, 170, 255, 0.16)';
        ctx.beginPath();
        ctx.rect(ox, oy, ow, oh);
        ctx.rect(x, y, rw, rh);
        ctx.fill('evenodd');
        ctx.strokeStyle = 'rgba(110, 190, 255, 0.95)';
        ctx.lineWidth = Math.max(0.7, 1.4 / zoom);
        ctx.setLineDash([5 / zoom, 4 / zoom]);
        ctx.strokeRect(ox + ctx.lineWidth / 2, oy + ctx.lineWidth / 2, Math.max(0, ow - ctx.lineWidth), Math.max(0, oh - ctx.lineWidth));
        ctx.setLineDash([]);
        /* Accentlijnen op de framelanden (referentie) */
        ctx.strokeStyle = 'rgba(255, 210, 90, 0.85)';
        ctx.lineWidth = Math.max(0.6, 1.1 / zoom);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + rw, y);
        ctx.moveTo(x, y + rh);
        ctx.lineTo(x + rw, y + rh);
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + rh);
        ctx.moveTo(x + rw, y);
        ctx.lineTo(x + rw, y + rh);
        ctx.stroke();
        var fontSize = Math.max(8, Math.min(12, 11 / Math.max(0.5, zoom)));
        ctx.font = '600 ' + fontSize + 'px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(180, 220, 255, 0.95)';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        var label = '±' + rangeCanvas + ' px';
        ctx.fillText(label, ox + 4 / zoom, oy + fontSize + 3 / zoom);
        ctx.restore();
      }

      function redrawSearchRangeGuideOnly() {
        if (lastPayload && lastPayload.gridRects && lastPayload.gridRects.length > 0) {
          drawGrid(lastPayload);
        }
      }

      function setSearchRangeGuideFocus(on) {
        if (searchRangeGuideHideTimer) {
          clearTimeout(searchRangeGuideHideTimer);
          searchRangeGuideHideTimer = null;
        }
        searchRangeGuideFocus = !!on;
        redrawSearchRangeGuideOnly();
      }

      function drawGrid(p) {
        if (!overlay) return;
        if (!p || !Array.isArray(p.gridRects) || p.gridRects.length === 0) {
          try {
            var octx = overlay.getContext('2d');
            if (octx && overlay.width > 0 && overlay.height > 0) octx.clearRect(0, 0, overlay.width, overlay.height);
          } catch (e) {}
          overlay.style.display = 'none';
          return;
        }
        const w = Math.max(1, p.displayWidth || 1);
        const h = Math.max(1, p.extendedDisplayHeight || p.displayHeight || 1);
        const zoom = getEffectiveZoomScale();
        const pixelW = Math.max(1, Math.round(w * zoom));
        const pixelH = Math.max(1, Math.round(h * zoom));
        overlay.width = pixelW;
        overlay.height = pixelH;
        overlay.style.width = w + 'px';
        overlay.style.height = h + 'px';
        overlay.style.display = 'block';
        const ctx = overlay.getContext('2d');
        if (!ctx) return;
        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.clearRect(0, 0, w, h);
        const lineW = Math.max(0.3, 1 / zoom);
        const lineWActive = Math.max(0.5, 2 / zoom);
        const activeNum = p.activeFrameNumber != null ? p.activeFrameNumber : (p.activeFrameIndex != null ? p.activeFrameIndex + 1 : 1);
        for (let i = 0; i < p.gridRects.length; i++) {
          const r = p.gridRects[i];
          const x = Number(r.x) || 0;
          const y = Number(r.y) || 0;
          const rw = Math.max(0, Number(r.width) || 0);
          const rh = Math.max(0, Number(r.height) || 0);
          if (rw <= 0 || rh <= 0) continue;
          const isActive = (r.frameNumber != null && r.frameNumber === activeNum);
          ctx.strokeStyle = isActive ? 'rgb(255, 60, 60)' : 'rgb(0, 255, 100)';
          ctx.lineWidth = isActive ? lineWActive : lineW;
          ctx.strokeRect(x + lineW / 2, y + lineW / 2, Math.max(0, rw - lineW), Math.max(0, rh - lineW));
          const fontSize = Math.max(4, Math.min(10, (12 * zoom) / 10));
          ctx.font = 'bold ' + fontSize + 'px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = isActive ? 'rgba(255,80,80,0.95)' : 'rgba(255,255,255,0.95)';
          ctx.fillText(String(r.frameNumber != null ? r.frameNumber : i + 1), x + rw / 2, y + rh / 2);
        }
        drawSearchRangeGuide(ctx, p, zoom);
        const ref = refLineDisplayFromPayload(p);
        if (ref && Number.isFinite(ref.y)) {
          ctx.strokeStyle = 'rgba(255, 220, 0, 0.95)';
          ctx.lineWidth = Math.max(0.8, 1.5 / zoom);
          ctx.setLineDash([4 / zoom, 3 / zoom]);
          ctx.beginPath();
          ctx.moveTo(ref.x0, ref.y);
          ctx.lineTo(ref.x0 + ref.w, ref.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      }

      function applyZoom() {
        const z = getEffectiveZoomScale();
        const mode = zoomSelect.value;
        if (api.setZoomMode) api.setZoomMode(mode);
        const isFitNoScroll = mode === 'fit-screen' || mode === 'fit-frame';
        viewport.classList.toggle('viewport-wrap--fit', isFitNoScroll);
        if (isFitNoScroll) {
          viewport.scrollLeft = 0;
          viewport.scrollTop = 0;
        }
        container.style.transform = 'scale(' + z + ')';
        if (lastPayload) {
          const w = Math.max(1, lastPayload.displayWidth || 1);
          const extH = Math.max(1, lastPayload.extendedDisplayHeight || lastPayload.displayHeight || 1);
          zoomWrapper.style.width = Math.max(1, Math.round(w * z)) + 'px';
          zoomWrapper.style.height = Math.max(1, Math.round(extH * z)) + 'px';
        }
        if (lastPayload && lastPayload.gridRects && lastPayload.gridRects.length > 0) {
          requestAnimationFrame(function () {
            drawGrid(lastPayload);
          });
        }
      }

      function applyExternalZoomMode(mode) {
        if (!isEmbeddedStrip && stripPreviewFloating) {
          applyFitScreenPreferred();
          return;
        }
        var next =
          mode === 'fit-screen' || mode === 'fit-width' || mode === 'fit-height' || mode === 'fit-frame'
            ? mode
            : null;
        if (!next || !zoomSelect) return;
        if (zoomSelect.value === next) return;
        zoomSelect.value = next;
        applyZoom();
      }

      var stripPreviewFloating = false;

      function applyFitScreenPreferred() {
        if (!zoomSelect) return;
        if (zoomSelect.value !== 'fit-screen') {
          zoomSelect.value = 'fit-screen';
        }
        applyZoom();
      }

      function applyStripPreviewDisplayPrefs(prefs) {
        if (isEmbeddedStrip) return;
        if (prefs && typeof prefs === 'object' && prefs.stripPreviewFloating !== undefined) {
          stripPreviewFloating = !!prefs.stripPreviewFloating;
        }
        if (stripPreviewFloating) applyFitScreenPreferred();
        else applyZoom();
      }

      function scrollToActiveFrame() {
        if (!lastPayload || !lastPayload.gridRects || lastPayload.gridRects.length === 0) return;
        const activeNum = lastPayload.activeFrameNumber != null ? lastPayload.activeFrameNumber : (lastPayload.activeFrameIndex != null ? lastPayload.activeFrameIndex + 1 : 1);
        const rect = lastPayload.gridRects.find(function (r) { return (r.frameNumber != null && r.frameNumber === activeNum); }) || lastPayload.gridRects[0];
        const left = Number(rect.x) || 0;
        const top = Number(rect.y) || 0;
        const rw = Math.max(0, Number(rect.width) || 0);
        const rh = Math.max(0, Number(rect.height) || 0);
        const cx = left + rw / 2;
        const cy = top + rh / 2;
        const w = Math.max(1, lastPayload.displayWidth || 1);
        const extH = Math.max(1, lastPayload.extendedDisplayHeight || lastPayload.displayHeight || 1);
        const scale = getEffectiveZoomScale();
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const scaledW = w * scale;
        const scaledH = extH * scale;
        const contentW = VIEWPORT_PADDING * 2 + scaledW;
        const contentH = VIEWPORT_PADDING * 2 + scaledH;
        var scrollLeft = Math.max(0, Math.min(contentW - vw, VIEWPORT_PADDING + cx * scale - vw / 2));
        var scrollTop;
        if (activeJump === 'top') {
          scrollTop = VIEWPORT_PADDING + top * scale - VIEWPORT_PADDING;
        } else if (activeJump === 'bottom') {
          const frameBottom = VIEWPORT_PADDING + (top + rh) * scale;
          scrollTop = frameBottom - vh + VIEWPORT_PADDING;
        } else {
          /* null of 'middle': actief frame in het midden van het zichtbare gebied */
          scrollTop = VIEWPORT_PADDING + cy * scale - vh / 2;
        }
        scrollTop = Math.max(0, Math.min(contentH - vh, scrollTop));
        viewport.scrollLeft = Math.round(scrollLeft);
        viewport.scrollTop = Math.round(scrollTop);
      }

      function scheduleScrollToActiveFrame() {
        suppressActiveJumpClearOnScroll = true;
        requestAnimationFrame(function () {
          scrollToActiveFrame();
          requestAnimationFrame(function () {
            scrollToActiveFrame();
            suppressActiveJumpClearOnScroll = false;
          });
        });
      }

      viewport.addEventListener('scroll', function () {
        if (suppressActiveJumpClearOnScroll) return;
        if (activeJump !== null) {
          activeJump = null;
          updateActiveButtons();
        }
      }, { passive: true });

      function syncVerticalAnchorFromPayload(payload) {
        if (!inputVerticalAnchorK || !payload) return;
        var n = 1;
        if (payload.numFrames != null && Number.isFinite(Number(payload.numFrames))) {
          n = Math.max(1, Math.floor(Number(payload.numFrames)));
        } else if (payload.gridRects && payload.gridRects.length > 0) {
          n = payload.gridRects.length;
        }
        inputVerticalAnchorK.min = '0';
        inputVerticalAnchorK.max = String(n);
        var k = payload.verticalAnchorCustomK != null ? Math.round(Number(payload.verticalAnchorCustomK)) : n;
        k = Math.max(0, Math.min(n, k));
        if (document.activeElement !== inputVerticalAnchorK) inputVerticalAnchorK.value = String(k);
      }

      function updateStripPanelLinkVisual() {
        if (!stripRightPanel || !chkPanelLink) return;
        stripRightPanel.classList.toggle('strip-panel-anchor-link-active', chkPanelLink.checked);
      }

      function syncPanelLinkFromPayload(payload) {
        if (!chkPanelLink || !payload) return;
        var on = payload.panelLinkVerticalAnchor !== false;
        if (document.activeElement !== chkPanelLink) chkPanelLink.checked = on;
        updateStripPanelLinkVisual();
      }

      function syncOrientFlipFromPayload(payload) {
        var lab = document.getElementById('strip-orient-label');
        var fh = document.getElementById('strip-flip-h');
        var fv = document.getElementById('strip-flip-v');
        if (!payload) {
          if (lab) { lab.textContent = '—'; lab.title = ''; }
          if (fh && document.activeElement !== fh) fh.checked = false;
          if (fv && document.activeElement !== fv) fv.checked = false;
          return;
        }
        if (lab && payload.orientLabel != null) {
          var t = String(payload.orientLabel);
          lab.textContent = t;
          lab.title = t;
        }
        if (fh && document.activeElement !== fh) fh.checked = !!payload.flipHorizontal;
        if (fv && document.activeElement !== fv) fv.checked = !!payload.flipVertical;
      }

      function stripPayloadHasContent(payload) {
        if (payload == null) return false;
        if (payload.stripDataUrl && String(payload.stripDataUrl).length > 0) return true;
        if (payload.gridRects && payload.gridRects.length > 0) return true;
        return false;
      }

      function filmFormatToStripKey(fmt) {
        var m = {
          '16mm-double': 'strip.filmFormat16mmDouble',
          '16mm-single': 'strip.filmFormat16mmSingle',
          super16: 'strip.filmFormatSuper16',
          '8mm': 'strip.filmFormat8mm',
          super8: 'strip.filmFormatSuper8',
          '9.5mm': 'strip.filmFormat9_5mm',
          '35mm': 'strip.filmFormat35mm'
        };
        return m[fmt] || null;
      }

      function updateScanInfoFromPayload(payload) {
        var si = payload && payload.scanInfo;
        var idxEl = document.getElementById('strip-scaninfo-index');
        var dimEl = document.getElementById('strip-scaninfo-dim');
        var dpiEl = document.getElementById('strip-scaninfo-dpi');
        var filmEl = document.getElementById('strip-scaninfo-film');
        if (!idxEl || !dimEl || !dpiEl || !filmEl) return;
        if (!payload || typeof payload !== 'object') {
          idxEl.textContent = '—';
          dimEl.textContent = '—';
          dpiEl.textContent = '—';
          filmEl.textContent = '—';
          return;
        }
        var scanIdx = payload.projectScanIndex != null ? Math.floor(Number(payload.projectScanIndex)) : NaN;
        var scanCount = payload.projectScanCount != null ? Math.floor(Number(payload.projectScanCount)) : NaN;
        if (Number.isFinite(scanIdx) && scanIdx >= 1 && Number.isFinite(scanCount) && scanCount >= 1) {
          idxEl.textContent = String(scanIdx) + ' / ' + String(scanCount);
        } else if (Number.isFinite(scanIdx) && scanIdx >= 1) {
          idxEl.textContent = String(scanIdx);
        } else {
          idxEl.textContent = '—';
        }
        if (!si || typeof si !== 'object') {
          dimEl.textContent = '—';
          dpiEl.textContent = '—';
          filmEl.textContent = '—';
          return;
        }
        var nw = Number(si.naturalWidth);
        var nh = Number(si.naturalHeight);
        dimEl.textContent = nw > 0 && nh > 0 ? Math.round(nw) + ' × ' + Math.round(nh) + ' px' : '—';
        var dpi = Number(si.scanDpi);
        dpiEl.textContent = dpi > 0 ? Math.round(dpi) + ' DPI' : '—';
        var fk = filmFormatToStripKey(si.filmFormat);
        var fmtLabel = fk ? stripTr(fk) : (si.filmFormat ? String(si.filmFormat) : '—');
        var pol =
          si.filmPolarity === 'negatief'
            ? stripTr('strip.polarityNegative')
            : stripTr('strip.polarityPositive');
        if (!si.filmFormat) filmEl.textContent = '—';
        else filmEl.textContent = fmtLabel + ', ' + pol;
      }

      function updateCurrentFrameDisplay(payload) {
        var inlineFrameEl = document.getElementById('raster-current-scan-display');
        if (!inlineFrameEl) return;
        if (!payload || typeof payload !== 'object') {
          inlineFrameEl.textContent = '—';
          inlineFrameEl.title = '';
          return;
        }
        var totalFrames = payload.numFrames != null
          ? Math.floor(Number(payload.numFrames))
          : (payload.gridRects && payload.gridRects.length ? payload.gridRects.length : NaN);
        var activeFrame = payload.activeFrameNumber != null
          ? Math.floor(Number(payload.activeFrameNumber))
          : (payload.activeFrameIndex != null ? Math.floor(Number(payload.activeFrameIndex)) + 1 : NaN);
        if (!Number.isFinite(totalFrames) || totalFrames < 1) totalFrames = NaN;
        if (!Number.isFinite(activeFrame) || activeFrame < 1) activeFrame = NaN;
        var globalFrame = lastBatchRangeContext && lastBatchRangeContext.globalFrameNumber != null
          ? Math.floor(Number(lastBatchRangeContext.globalFrameNumber))
          : NaN;
        var rangeText = '';
        if (
          lastBatchRangeContext &&
          lastBatchRangeContext.range &&
          Number.isFinite(Number(lastBatchRangeContext.range.from)) &&
          Number.isFinite(Number(lastBatchRangeContext.range.to))
        ) {
          rangeText =
            ' | R' +
            String(Math.max(1, Math.floor(Number(lastBatchRangeContext.rangeIndex) || 0) + 1)) +
            ':' +
            String(Math.floor(Number(lastBatchRangeContext.range.from))) +
            '-' +
            String(Math.floor(Number(lastBatchRangeContext.range.to)));
        }
        if (!Number.isFinite(globalFrame) || globalFrame < 1) globalFrame = NaN;
        if (Number.isFinite(activeFrame) && Number.isFinite(totalFrames)) {
          inlineFrameEl.textContent = Number.isFinite(globalFrame)
            ? (String(activeFrame) + '/' + String(totalFrames) + ' | G' + String(globalFrame) + rangeText)
            : (String(activeFrame) + ' / ' + String(totalFrames));
          inlineFrameEl.title = Number.isFinite(globalFrame)
            ? ('Frame ' + String(activeFrame) + '/' + String(totalFrames) + ' | Global ' + String(globalFrame) + rangeText)
            : (String(activeFrame) + ' / ' + String(totalFrames));
          return;
        }
        if (Number.isFinite(activeFrame)) {
          inlineFrameEl.textContent = Number.isFinite(globalFrame)
            ? (String(activeFrame) + ' | G' + String(globalFrame) + rangeText)
            : String(activeFrame);
          inlineFrameEl.title = Number.isFinite(globalFrame)
            ? ('Frame ' + String(activeFrame) + ' | Global ' + String(globalFrame) + rangeText)
            : String(activeFrame);
          return;
        }
        inlineFrameEl.textContent = '—';
        inlineFrameEl.title = '';
      }

      function updateCurrentRangeDisplay(rangeCtx) {
        if (!currentRangeDisplayEl) return;
        if (!rangeCtx || typeof rangeCtx !== 'object') {
          currentRangeDisplayEl.textContent = stripTr('stripWindow.currentRangeUnknown');
          currentRangeDisplayEl.title = '';
          return;
        }
        var idx = Math.floor(Number(rangeCtx.rangeIndex));
        var total = Math.floor(Number(rangeCtx.rangeCount));
        var r = rangeCtx.range;
        var g = Math.floor(Number(rangeCtx.globalFrameNumber));
        if (Number.isFinite(idx) && idx >= 0 && Number.isFinite(total) && total > 0 && r && Number.isFinite(Number(r.from)) && Number.isFinite(Number(r.to))) {
          currentRangeDisplayEl.textContent = stripTrFmt('stripWindow.currentRangeDisplay', {
            index: idx + 1,
            total: total,
            from: Math.floor(Number(r.from)),
            to: Math.floor(Number(r.to))
          });
          currentRangeDisplayEl.title = Number.isFinite(g) && g > 0
            ? stripTrFmt('stripWindow.currentRangeDisplayWithFrameTitle', {
                frame: g,
                index: idx + 1,
                total: total,

        var scanNo = payload && payload.projectScanIndex != null ? Math.floor(Number(payload.projectScanIndex)) : 0;
        var frameKey = String(scanNo) + ':' + String(frameNo);
        var now = Date.now();
        if (force !== true && frameKey === lastRangeContextFrameKey && now - lastRangeContextRefreshAt < 350) {
          return;

        lastRangeContextFrameKey = frameKey;
        lastRangeContextRefreshAt = now;
        if (!api || !api.getBatchRangeContext) {

          updateCurrentRangeDisplay(null);

        if (e.shiftKey && api.applyVerticalRigidPanBoundary) {
          api.applyVerticalRigidPanBoundary(false);
          macroRecordStep({ type: 'verticalBoundary', towardCompress: false, label: stripTr('stripWindow.btnVertUp') + ' max' });
        } else if (api.applyVerticalFixedBottomStep) {
          api.applyVerticalFixedBottomStep(stepPx, 'stretch');
          macroRecordStep({ type: 'verticalStep', kind: 'stretch', step: stepPx, label: stripTr('stripWindow.btnVertUp') + ' ' + stepPx });
        }
      });
      document.getElementById('btn-scan-prev').addEventListener('click', function () {
        runNavigateScan('prev', false, true);
      });
      document.getElementById('btn-scan-next').addEventListener('click', function () {
        runNavigateScan('next', true, true);
      });
      if (btnRangePrev) {
        btnRangePrev.addEventListener('click', function () {
          if (!api.goToPreviousBatchRange) return;
          setBusy(true);
          Promise.resolve(api.goToPreviousBatchRange())
            .catch(function () {})
            .finally(function () {
              setBusy(false);
              setTimeout(function () { refreshRangeContextUiFromMain(lastPayload, true); }, 30);
              setTimeout(function () { refreshRangeContextUiFromMain(lastPayload, true); }, 160);
            });
        });
      }
      if (btnRangeNext) {
        btnRangeNext.addEventListener('click', function () {
          if (!api.goToNextBatchRange) return;
          setBusy(true);
          Promise.resolve(api.goToNextBatchRange())
            .catch(function () {})
            .finally(function () {
              setBusy(false);
              setTimeout(function () { refreshRangeContextUiFromMain(lastPayload, true); }, 30);
              setTimeout(function () { refreshRangeContextUiFromMain(lastPayload, true); }, 160);
            });
        });
      }
      if (btnRangeUseCurrentRef) {
        btnRangeUseCurrentRef.addEventListener('click', function () {
          if (!api.setCurrentFrameAsBatchRangeReference) return;
          setBusy(true);
          Promise.resolve(api.setCurrentFrameAsBatchRangeReference())
            .catch(function () {})
            .finally(function () { setBusy(false); });
        });
      }
      if (chkAutoAdvanceAlign) {
        chkAutoAdvanceAlign.addEventListener('change', function () {
          var on = !!chkAutoAdvanceAlign.checked;
          if (api.setAutoAdvanceAfterAlign) api.setAutoAdvanceAfterAlign(on);
          var labAdv = chkAutoAdvanceAlign.closest('label');
          if (labAdv) labAdv.classList.toggle('is-active', on);
          updateStopProgressUi();
        });
      }
      if (btnStopProgress) {
        btnStopProgress.addEventListener('click', function () {
          stopAllProgress();
        });
      }
      document.getElementById('btn-scan-goto').addEventListener('click', function () {
        doScanGoto();
      });
      if (inputScanGoto) {
        inputScanGoto.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            doScanGoto();
          }
        });
      }
      var btnPickScanFolder = document.getElementById('btn-strip-pick-scan-folder');
      if (btnPickScanFolder && api.requestPickScanFolderFromStrip) {
        btnPickScanFolder.addEventListener('click', function () {
          api.requestPickScanFolderFromStrip().catch(function () {});
        });
      }
      var btnStripRefresh = document.getElementById('btn-strip-refresh');
      if (btnStripRefresh && api.requestStripRefresh) {
        btnStripRefresh.addEventListener('click', function () {
          setBusy(true);
          api.requestStripRefresh();
        });
      }

      readAssistHelpState();
      wireAssistHelpDrag();
      applyAssistHelpPosition();
      setAssistHelpOpen(assistHelpState.open);
      if (btnAssistHelp) {
        btnAssistHelp.addEventListener('click', function () {
          setAssistHelpOpen(!assistHelpState.open);
        });
      }
      if (btnAssistHelpClose) {
        btnAssistHelpClose.addEventListener('click', function () {
          setAssistHelpOpen(false);
        });
      }
      window.addEventListener('resize', function () {
        if (assistHelpState.open) applyAssistHelpPosition();
      });

      setMacroStatus(stripTr('stripWindow.macroStatusIdle'));
      macroNormalizeSpeed();
      macroNormalizeLoopDelay();
      updateMacroUi();
      updateAssistExtraPresetUi();
      updateAssistFieldsForPreset();
      updateActiveButtons();

      if (api.onStripPreviewDisplayPrefs && !isEmbeddedStrip) {
        api.onStripPreviewDisplayPrefs(function (prefs) {
          applyStripPreviewDisplayPrefs(prefs);
        });
      }
      if (!isEmbeddedStrip && api.getAppSettings) {
        api.getAppSettings().then(function (s) {
          applyStripPreviewDisplayPrefs({
            stripPreviewFloating: !!(s && s.stripPreviewFloating === true)
          });
        }).catch(function () {
          applyZoom();
        });
      }
    })();
  </script>
</body>
</html>
