<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Film2Frame – Frame Pixel Editor</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }
    .f2f-pixel-editor-window {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }
    .f2f-pixel-editor-window .panel.pixel-editor-panel--fullwidth {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin: 0;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .f2f-pixel-editor-window .pixel-editor-panel--fullwidth .sub-panel-collapsible {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    .f2f-pixel-editor-window .pixel-editor-viewport {
      flex: 1 1 auto;
      min-height: 200px;
      height: auto !important;
      max-height: none !important;
    }
  </style>
</head>
<body class="f2f-pixel-editor-window">
  <section class="panel pixel-editor-panel pixel-editor-panel--fullwidth" aria-labelledby="f2f-pixel-editor-title">
    <div class="sub-panel-header">
      <h2 id="f2f-pixel-editor-title" data-i18n="pixelEditor.sectionTitle">FRAME PIXEL EDITOR</h2>
    </div>
    <div class="sub-panel-collapsible">
      <div class="row pixel-editor-output-row">
        <div class="pixel-editor-output-left">
          <label class="pixel-editor-output-label" data-i18n="pixelEditor.outputFolderLabel">Pixel-editor map (PNG)</label>
          <button type="button" id="f2f-pixel-editor-pick-folder" class="btn btn-secondary small" data-i18n="pixelEditor.pickFolderButton">Kies map…</button>
          <span id="f2f-pixel-editor-output-path" class="filename pixel-editor-output-path">—</span>
          <button type="button" id="f2f-pixel-editor-prev-frame" class="btn btn-secondary" data-i18n="pixelEditor.prevFrameButton">◀ Vorige</button>
          <button type="button" id="f2f-pixel-editor-next-frame" class="btn btn-secondary" data-i18n="pixelEditor.nextFrameButton">Volgende ▶</button>
        </div>
        <div class="pixel-editor-goto-frame">
          <label for="f2f-pixel-editor-goto-frame" class="pixel-editor-goto-frame-label" data-i18n="pixelEditor.goToFrameLabel">Frame</label>
          <input type="number" id="f2f-pixel-editor-goto-frame" class="input-num" min="1" value="1" data-i18n-title="pixelEditor.goToFrameTooltip" />
          <button type="button" id="f2f-pixel-editor-goto-frame-go" class="btn btn-secondary small" data-i18n="pixelEditor.goToFrameButton" data-i18n-title="pixelEditor.goToFrameTooltip">Ga naar…</button>
        </div>
      </div>
      <div class="row pixel-editor-output-row pixel-editor-source-row">
        <div class="pixel-editor-output-left">
          <label class="pixel-editor-output-label" data-i18n="pixelEditor.sourceFolderLabel">Bronmap (scans)</label>
          <button type="button" id="f2f-pixel-editor-pick-source-folder" class="btn btn-secondary small" data-i18n="pixelEditor.pickSourceFolderButton">Kies bronmap…</button>
          <button type="button" id="f2f-pixel-editor-clear-source-folder" class="btn btn-secondary small hidden" data-i18n="pixelEditor.clearSourceFolderButton" data-i18n-title="pixelEditor.clearSourceFolderTooltip">Wissen</button>
          <button type="button" id="f2f-pixel-editor-source-prev" class="btn btn-secondary small hidden" data-i18n="pixelEditor.sourceFilePrevButton" data-i18n-title="pixelEditor.sourceFilePrevTooltip">◀ Bestand</button>
          <button type="button" id="f2f-pixel-editor-source-next" class="btn btn-secondary small hidden" data-i18n="pixelEditor.sourceFileNextButton" data-i18n-title="pixelEditor.sourceFileNextTooltip">Bestand ▶</button>
          <span id="f2f-pixel-editor-source-path" class="filename pixel-editor-output-path">—</span>
        </div>
      </div>
      <p class="overlay-hint pixel-editor-hint" data-i18n="pixelEditor.hint"></p>
      <div class="pixel-editor-display-toolbar">
        <div class="pixel-editor-zoom-cluster row pixel-editor-zoom-row">
          <label for="f2f-pixel-editor-zoom-mode" class="pixel-editor-zoom-label" data-i18n="pixelEditor.zoomModeLabel">Weergave</label>
          <select id="f2f-pixel-editor-zoom-mode" class="input-select pixel-editor-zoom-select" data-i18n-title="pixelEditor.zoomModeTooltip">
            <option value="fit" data-i18n="pixelEditor.zoomFit">Heel beeld (maximaal)</option>
            <option value="width" data-i18n="pixelEditor.zoomWidth">Volle breedte</option>
            <option value="height" data-i18n="pixelEditor.zoomHeight">Volle hoogte</option>
            <option value="percent" data-i18n="pixelEditor.zoomPercentMode">Percentage (1–1000%)</option>
          </select>
          <span id="f2f-pixel-editor-zoom-pct-wrap" class="pixel-editor-zoom-pct-wrap hidden">
            <input type="range" id="f2f-pixel-editor-zoom-pct" min="1" max="1000" value="100" data-i18n-title="pixelEditor.zoomPercentTooltip" />
            <span id="f2f-pixel-editor-zoom-pct-val" class="pixel-editor-zoom-pct-val">100</span><span class="pixel-editor-zoom-pct-suffix">%</span>
          </span>
        </div>
        <div class="pixel-editor-frame-caption-wrap">
          <span id="f2f-pixel-editor-frame-caption" class="pixel-editor-frame-caption" aria-live="polite">—</span>
        </div>
      </div>
      <div class="pixel-editor-viewport" id="f2f-pixel-editor-viewport">
        <div id="f2f-pixel-editor-brush-ring" class="pixel-editor-brush-ring hidden" aria-hidden="true"></div>
        <canvas id="f2f-pixel-editor-canvas" width="0" height="0"></canvas>
      </div>
      <div class="pixel-editor-toolbar">
        <label class="pixel-editor-label" for="f2f-pixel-editor-brush-mode"><span data-i18n="pixelEditor.brushModeLabel">Penseel</span></label>
        <select id="f2f-pixel-editor-brush-mode" class="input-select pixel-editor-toolbar-select" data-i18n-title="pixelEditor.brushModeTooltip">
          <option value="color" data-i18n="pixelEditor.brushModeColor">Vaste kleur</option>
          <option value="underlying" data-i18n="pixelEditor.brushModeUnderlying">Onderliggende scan</option>
        </select>
        <span id="f2f-pixel-editor-sample-wrap" class="pixel-editor-sample-inline hidden">
          <label class="pixel-editor-label" for="f2f-pixel-editor-sample-dir"><span data-i18n="pixelEditor.sampleDirLabel">Monster van</span></label>
          <select id="f2f-pixel-editor-sample-dir" class="input-select pixel-editor-toolbar-select pixel-editor-dir-select" data-i18n-title="pixelEditor.sampleDirTooltip">
            <option value="left" data-i18n="pixelEditor.sampleLeft">Links</option>
            <option value="right" data-i18n="pixelEditor.sampleRight">Rechts</option>
            <option value="up" data-i18n="pixelEditor.sampleUp">Boven</option>
            <option value="down" data-i18n="pixelEditor.sampleDown">Onder</option>
          </select>
        </span>
        <label class="pixel-editor-label"><span data-i18n="pixelEditor.colorLabel">Kleur</span> <input type="color" id="f2f-pixel-editor-color" value="#7a7a7a" /></label>
        <button type="button" id="f2f-pixel-editor-eyedropper" class="btn btn-secondary small" data-i18n="pixelEditor.eyedropper">Pipet</button>
        <label class="pixel-editor-label"><span data-i18n="pixelEditor.brushLabel">Penseel (px)</span> <input type="range" id="f2f-pixel-editor-brush" min="1" max="80" value="14" /></label>
        <span id="f2f-pixel-editor-brush-val" class="pixel-editor-brush-val">14</span>
        <label class="checkbox-label pixel-editor-feather-chk">
          <input type="checkbox" id="f2f-pixel-editor-feather" checked />
          <span data-i18n="pixelEditor.feather">Veer (zachte rand)</span>
        </label>
        <label class="pixel-editor-label"><span data-i18n="pixelEditor.featherAmount">Veerbreedte (%)</span> <input type="range" id="f2f-pixel-editor-feather-pct" min="5" max="100" value="45" /></label>
      </div>
    </div>
  </section>
  <script type="module" src="../renderer/pixel-editor-window.js"></script>
</body>
</html>
