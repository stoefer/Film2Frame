<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film2Frame</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; color: #e0e0e0; font-family: system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; }
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #444;
      background: #252525;
      min-width: 0;
    }
    .header h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 0 1 auto; min-width: 0; }
    .header-open-align {
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #7c2d12;
      border: 1px solid #ea580c;
      border-radius: 4px;
      color: #fff7ed;
      font-weight: 600;
    }
    .header-open-align:hover { background: #9a3412; border-color: #fb923c; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-refresh {
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e8e8e8;
      font-weight: 500;
    }
    .header-refresh:hover { background: #333; border-color: #666; }
    .header-filename {
      flex: 0 1 auto;
      max-width: min(520px, 55vw);
      font-size: 12px;
      font-weight: 500;
      color: #9cdcfe;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid #333;
      background: #1a1a1a;
      min-width: 0;
    }
    .toolbar-panel {
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      padding: 8px 10px;
      background: #222;
    }
    .toolbar-panel--left {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-x: auto;
    }
    .toolbar-panel__left-body {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
      gap: 12px;
      min-width: 0;
      width: 100%;
    }
    /* RASTER: onder scanlint-preview, één horizontale rij; Vorige/Volgende visueel gecentreerd */
    .raster-subpanel--below-preview {
      flex-shrink: 0;
      width: 100%;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 8px 12px 10px;
      background: #1a1a1a;
      min-width: 0;
    }
    .raster-subpanel__head {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }
    .raster-subpanel__title {
      margin: 0;
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #9a9a9a;
    }
    .raster-subpanel__toolbar-row {
      flex: 1 1 0;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow-x: auto;
    }
    .raster-subpanel__lead {
      flex: 1 1 0;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .raster-subpanel__lead .raster-field {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow: visible;
    }
    .raster-subpanel__lead label {
      white-space: nowrap;
      color: #c8c8c8;
      font-size: 13px;
    }
    .raster-subpanel__lead input[type="number"] {
      width: 7rem;
      min-width: 7rem;
      max-width: none;
      min-height: 44px;
      padding: 10px 12px;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      box-sizing: border-box;
      flex-shrink: 0;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .raster-subpanel__lead input[type="number"]::-webkit-outer-spin-button,
    .raster-subpanel__lead input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .raster-subpanel__nav-center {
      flex: 0 0 auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .raster-subpanel__trail {
      flex: 1 1 0;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }
    .yonder-block__goto-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }
    .toolbar-panel__left-column {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      align-items: stretch;
    }
    .toolbar-panel--right {
      flex: 0 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
      max-width: 100%;
    }
    .toolbar-panel__top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }
    .toolbar-panel__spacer {
      flex: 1 1 auto;
      min-height: 6px;
    }
    .toolbar-panel__reset-row {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      width: 100%;
      min-width: 0;
      margin-top: -10px;
    }
    .toolbar-panel__reset-row #btn-reset {
      flex-shrink: 0;
    }
    .toolbar-panel__reset-row__xy {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .toolbar-panel__reset-row__xy input[type="number"] {
      width: 80px;
      min-width: 72px;
    }
    .strip-orient-flip-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      padding-left: 4px;
      border-left: 1px solid #3a3a3a;
      margin-left: 2px;
    }
    .toolbar-panel__orient-zoom-row {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      width: 100%;
      min-width: 0;
    }
    .strip-orient-flip-group--row {
      border-left: none;
      margin-left: 0;
      padding-left: 0;
      flex: 0 1 auto;
      min-width: 0;
    }
    .toolbar-zoom-inline {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      flex: 1 1 200px;
      min-width: 0;
    }
    .toolbar-zoom-inline label {
      flex-shrink: 0;
      color: #aaa;
      margin: 0;
      white-space: nowrap;
    }
    .toolbar-zoom-inline .zoom-select {
      flex: 1 1 0;
      min-width: 120px;
      max-width: none;
      margin-left: 0;
    }
    .strip-orient-label-inline {
      font-size: 12px;
      color: #b0b0b0;
      max-width: min(280px, 40vw);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-strip-rotate90 {
      padding: 5px 10px;
      font-size: 12px;
      background: #3a3a3a;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-strip-rotate90:hover { background: #484848; }
    .strip-flip-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      color: #ddd;
    }
    .strip-flip-label input { width: auto; margin: 0; flex-shrink: 0; }
    .toolbar-panel__spacer-right {
      flex: 1 1 auto;
      min-height: 4px;
    }
    .toolbar-panel-row--positie {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid #333;
    }
    .positie-label { color: #aaa; margin-right: 4px; }
    .toolbar-panel-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }
    .toolbar-panel-row--breedte-offset {
      margin-top: 15px;
    }
    .toolbar-panel-row--spread {
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .toolbar-panel-row--spread .step-group { flex: 0 1 auto; }
    .toolbar-panel-row--spread .step-group--compress-stack {
      flex: 0 0 auto;
      flex-direction: column;
      align-items: stretch;
      align-self: center;
      gap: 4px;
      margin-top: -20px;
    }
    .toolbar-panel-row--spread .step-group--compress-stack .compress-stack-label {
      display: block;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      line-height: 1.2;
      margin: 0;
    }
    .toolbar-panel-row--spread .step-group--compress-stack .btn-vert-fixed-bottom {
      flex-shrink: 0;
      width: 100%;
      white-space: nowrap;
      padding-left: 8px;
      padding-right: 8px;
    }
    .toolbar label { margin-right: 4px; color: #aaa; }
    .toolbar input[type="number"] { width: 72px; padding: 6px 8px; background: #2a2a2a; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 13px; }
    .toolbar button { padding: 6px 12px; cursor: pointer; background: #333; color: #e0e0e0; border: 1px solid #555; border-radius: 4px; }
    .toolbar button:hover { background: #444; }
    .toolbar button:active { background: #555; }
    .toolbar button.btn-active { border: 2px solid rgb(220, 55, 55); box-shadow: 0 0 0 1px rgba(255, 80, 80, 0.45); background: #3a2a2a; }
    .toolbar .step-group { display: flex; align-items: center; gap: 4px; }
    .toolbar .step-group .arrow { padding: 6px 10px; font-size: 16px; line-height: 1; }
    .toolbar .preset-name-input { padding: 6px 8px; background: #2a2a2a; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 12px; }
    .toolbar .preset-block .preset-name-input {
      width: 100%;
      min-width: 180px;
      box-sizing: border-box;
    }
    .toolbar select#strip-preset-list { margin-left: 0; }
    /* Rij 1: label — Rij 2: naam (volle rest) | Opslaan | Wissen — Rij 3: dropdown (volle rest) | Laden */
    .preset-block {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(5em, auto) minmax(5em, auto);
      grid-template-rows: auto auto auto;
      gap: 8px 10px;
      align-items: center;
      width: 100%;
      min-width: 0;
    }
    .preset-block__label {
      grid-column: 1 / -1;
      grid-row: 1;
      margin: 0;
      color: #aaa;
      white-space: nowrap;
      display: block;
    }
    .preset-block__name {
      grid-column: 1;
      grid-row: 2;
      width: 100%;
      min-width: 0;
    }
    .preset-block__save {
      grid-column: 2;
      grid-row: 2;
      justify-self: stretch;
      align-self: stretch;
      min-width: 5em;
    }
    .preset-block__delete {
      grid-column: 3;
      grid-row: 2;
      justify-self: stretch;
      align-self: stretch;
      min-width: 5em;
    }
    .preset-block__select {
      grid-column: 1 / span 2;
      grid-row: 3;
      width: 100%;
      min-width: 0;
      max-width: none;
      margin-left: 0;
    }
    .preset-block__load {
      grid-column: 3;
      grid-row: 3;
      justify-self: stretch;
      align-self: stretch;
      min-width: 5em;
    }
    .toolbar button.btn-preset-delete {
      background: #5c1e1e;
      border-color: #a83232;
      color: #ffdede;
      font-weight: 600;
    }
    .toolbar button.btn-preset-delete:hover {
      background: #722626;
      border-color: #c04040;
      color: #fff;
    }
    .toolbar button.btn-preset-delete:active {
      background: #551a1a;
    }
    .yonder-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      flex: 0 1 auto;
      min-width: 0;
    }
    .yonder-block__row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .yonder-block__nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    /* Vorige / Volgende / Ga naar: duidelijke blauwe rand (Scanlint-navigatie) */
    .raster-subpanel__nav-center .btn-scan-nav,
    .raster-subpanel__trail #btn-scan-goto,
    .toolbar .yonder-block__nav .btn-scan-nav {
      border: 2px solid #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35);
    }
    .raster-subpanel__nav-center .btn-scan-nav:hover,
    .raster-subpanel__trail #btn-scan-goto:hover,
    .toolbar .yonder-block__nav .btn-scan-nav:hover {
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.45);
    }
    .raster-subpanel__nav-center .btn-scan-nav:active,
    .raster-subpanel__trail #btn-scan-goto:active,
    .toolbar .yonder-block__nav .btn-scan-nav:active {
      border-color: #2563eb;
    }
    .raster-subpanel__nav-center .btn-scan-nav,
    .raster-subpanel__trail #btn-scan-goto {
      min-height: 44px;
      height: 44px;
      padding: 0 14px;
      font-size: 13px;
      cursor: pointer;
      background: #2a2a2a;
      border-radius: 4px;
      color: #e8e8e8;
      font-weight: 600;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    /* Previous / Next: gelijke breedte en hoogte (RASTER sub-menu) */
    .raster-subpanel__nav-center .btn-scan-nav {
      width: 9.5rem;
      min-width: 9.5rem;
      max-width: 9.5rem;
    }
    .input-scan-goto {
      width: 52px;
      padding: 6px 6px;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
    }
    /* Alleen scan-nummer in RASTER-balk: zelfde tikhoogte; ~5 cijfers zichtbaar; geen spinnerpijltjes */
    .raster-subpanel--below-preview #input-scan-goto {
      min-height: 44px;
      width: calc(5ch + 2.25rem);
      min-width: calc(5ch + 2.25rem);
      max-width: none;
      padding: 10px 12px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      box-sizing: border-box;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .raster-subpanel--below-preview #input-scan-goto::-webkit-outer-spin-button,
    .raster-subpanel--below-preview #input-scan-goto::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .raster-subpanel--below-preview .label-scan-goto {
      font-size: 13px;
    }
    .label-scan-goto {
      color: #aaa;
      margin: 0;
      white-space: nowrap;
    }
    .zoom-select { padding: 6px 8px; background: #2a2a2a; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 13px; margin-left: 0; }
    .viewport-wrap { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: #0d0d0d; }
    /* Layout-grootte = visuele zoom (transform schaalt alleen tekening); scrollgebied klopt dan bij 400–1000%. */
    .zoom-wrapper { flex-shrink: 0; overflow: visible; position: relative; }
    .strip-container { position: relative; display: inline-block; transform-origin: 0 0; }
    /* Geen object-fit: contain — bij miniem andere beeldverhouding PNG t.o.v. payload ontstaan pilaarbalken; raster is op payload-pixels getekend. */
    .strip-container img {
      display: block;
      vertical-align: top;
      position: relative;
      z-index: 1;
      object-fit: fill;
      max-width: none;
    }
    .strip-overlay { position: absolute; left: 0; top: 0; pointer-events: auto; z-index: 2; cursor: crosshair; }
    .placeholder { padding: 24px; color: #666; text-align: center; }
    .toolbar-panel__anchor-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      margin-top: 6px;
      border-top: 1px solid #333;
    }
    .toolbar-panel__anchor-row label { color: #aaa; margin: 0; white-space: nowrap; }
    .toolbar-panel__anchor-row select { max-width: 220px; }
    .toolbar-panel__anchor-row--right {
      align-self: stretch;
      width: 100%;
    }
    .toolbar-panel__anchor-row--right select.zoom-select {
      max-width: none;
      flex: 1 1 140px;
      min-width: 0;
    }
    .toolbar-panel__anchor-row .line-index-step-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 2px;
    }
    .toolbar-panel__anchor-row .line-index-step-btn {
      padding: 4px 8px;
      font-size: 12px;
      line-height: 1.2;
      min-height: 26px;
    }
    .toolbar-panel-row--below-anchor {
      padding-top: 8px;
      margin-top: 6px;
      border-top: 1px solid #333;
      align-self: stretch;
      width: 100%;
    }
    /* Koppeling referentielijn → Hand/Duw/Shift+Duw: rode rand wanneer actief */
    .strip-panel-with-link.strip-panel-anchor-link-active {
      border: 2px solid rgb(220, 55, 55);
      box-shadow: 0 0 0 1px rgba(255, 80, 80, 0.45), inset 0 0 12px rgba(120, 30, 30, 0.25);
      background: linear-gradient(180deg, rgba(70, 28, 28, 0.4) 0%, #222 32%);
    }
    .strip-panel-link-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 4px 8px;
      margin: -4px -4px 2px;
      border-bottom: 1px solid #3a3a3a;
    }
    .strip-panel-link-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: #e8e8e8;
      font-weight: 600;
      font-size: 12px;
    }
    .strip-panel-link-toggle input {
      width: auto;
      margin: 0;
      flex-shrink: 0;
    }
    .strip-panel-link-hint {
      font-size: 11px;
      font-weight: 400;
      color: #aaa;
      max-width: 100%;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="strip-header-title"></h1>
    <div class="header-actions">
      <button type="button" id="btn-strip-refresh" class="header-refresh"></button>
      <button type="button" id="btn-open-align-window" class="header-open-align"></button>
    </div>
    <span id="strip-header-filename" class="header-filename" title="">—</span>
  </div>
  <div class="toolbar">
    <div class="toolbar-panel toolbar-panel--left">
      <div class="toolbar-panel__left-body">
        <div class="toolbar-panel__left-column">
          <div class="preset-block">
            <label class="preset-block__label" for="strip-preset-name"></label>
            <input type="text" id="strip-preset-name" class="preset-name-input preset-block__name" placeholder="" maxlength="80" />
            <button type="button" id="strip-preset-save" class="preset-block__save"></button>
            <button type="button" id="strip-preset-delete" class="preset-block__delete btn-preset-delete"></button>
            <select id="strip-preset-list" class="zoom-select preset-block__select"><option value=""></option></select>
            <button type="button" id="strip-preset-load" class="preset-block__load"></button>
          </div>
          <div class="toolbar-panel__spacer" aria-hidden="true"></div>
          <div class="toolbar-panel__reset-row">
            <button type="button" id="btn-reset"></button>
            <div class="toolbar-panel__reset-row__xy">
              <span><label></label><input type="number" id="input-x" placeholder="0" /></span>
              <span><label></label><input type="number" id="input-y" placeholder="0" /></span>
            </div>
          </div>
          <div class="toolbar-panel__orient-zoom-row">
            <div class="strip-orient-flip-group strip-orient-flip-group--row">
              <span id="strip-orient-label" class="strip-orient-label-inline" title="">—</span>
              <button type="button" id="btn-strip-rotate90" class="btn-strip-rotate90"></button>
              <label class="strip-flip-label"><input type="checkbox" id="strip-flip-h" /></label>
              <label class="strip-flip-label"><input type="checkbox" id="strip-flip-v" /></label>
            </div>
            <div class="toolbar-zoom-inline">
              <label for="zoom"></label>
              <select id="zoom" class="zoom-select">
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
                <option value="4">400%</option>
                <option value="8">800%</option>
                <option value="10">1000%</option>
                <option value="fit-width" selected></option>
                <option value="fit-height"></option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="toolbar-panel toolbar-panel--right strip-panel-with-link strip-panel-anchor-link-active" id="strip-right-tools">

  <script>
    (function () {
      const api = window.stripApi;

      const chkPanelLink = document.getElementById('strip-panel-vertical-anchor-link');
      const headerFilenameEl = document.getElementById('strip-header-filename');

      let lastPayload = null;

      var stripLocaleDict = {};
      function stripTr(key) {
        var v = stripLocaleDict[key];
        return typeof v === 'string' && v.length ? v : key;
      }
      function stripTrFmt(key, vars) {
        var s = stripTr(key);
        if (!vars) return s;
        Object.keys(vars).forEach(function (k) {
          s = s.split('{' + k + '}').join(String(vars[k]));
        });
        return s;
      }
      function applyStripPreviewLocaleStrings() {
        document.title = stripTr('stripWindow.documentTitle');

        var rastSec = document.querySelector('.raster-subpanel');

        var labYB = document.querySelector('label[for="input-y-bottom"]');

        var bNx = document.getElementById('btn-scan-next');

        var presetBlk = document.querySelector('.preset-block');

        var labPreset = document.querySelector('label[for="strip-preset-name"]');
        if (labPreset) labPreset.textContent = stripTr('stripWindow.presetLabel');

        if (bPD) {

        }
        var selPreset = document.getElementById('strip-preset-list');

          selPreset.setAttribute('aria-label', stripTr('stripWindow.presetSelectAria'));

        var ix = document.getElementById('input-x');

        }
        var iy = document.getElementById('input-y');
        if (iy && iy.parentElement) {

        var labZm = document.querySelector('label[for="zoom"]');
        if (labZm) labZm.textContent = stripTr('stripWindow.labelZoom');
        var orientZoomRow = document.querySelector('.toolbar-panel__orient-zoom-row');
        if (orientZoomRow) orientZoomRow.title = stripTr('stripWindow.zoomStackTitle');
        var optFW = zoomSelect && zoomSelect.querySelector('option[value="fit-width"]');
        var optFH = zoomSelect && zoomSelect.querySelector('option[value="fit-height"]');
        if (optFW) {
          optFW.textContent = stripTr('stripWindow.zoomFitWidth');
          optFW.title = stripTr('stripWindow.zoomFitWidthTitle');
        }
        if (optFH) {
          optFH.textContent = stripTr('stripWindow.zoomFitHeight');
          optFH.title = stripTr('stripWindow.zoomFitHeightTitle');
        }
        var orientG = document.querySelector('.strip-orient-flip-group--row');
        if (orientG) orientG.title = stripTr('stripWindow.orientFlipTitle');
        var btnR90 = document.getElementById('btn-strip-rotate90');
        if (btnR90) btnR90.textContent = stripTr('stripWindow.btnRotate90');
        function setFlipLabelText(labelEl, msg) {
          if (!labelEl) return;
          var t = ' ' + String(msg).trim();
          var ch = labelEl.childNodes;
          for (var i = 0; i < ch.length; i++) {
            if (ch[i].nodeType === 3) {
              ch[i].textContent = t;
              return;
            }
          }
          labelEl.appendChild(document.createTextNode(t));
        }
        var flabs = document.querySelectorAll('.strip-flip-label');
        if (flabs.length >= 1) setFlipLabelText(flabs[0], stripTr('stripWindow.flipH'));
        if (flabs.length >= 2) setFlipLabelText(flabs[1], stripTr('stripWindow.flipV'));
        var linkRow = document.querySelector('.strip-panel-link-row');
        if (linkRow) linkRow.title = stripTr('stripWindow.panelLinkRowTitle');
        var linkSpan = document.querySelector('.strip-panel-link-toggle span');
        if (linkSpan) linkSpan.textContent = stripTr('stripWindow.panelLinkLabel');
        var linkHint = document.querySelector('.strip-panel-link-hint');
        if (linkHint) linkHint.textContent = stripTr('stripWindow.panelLinkHint');
        var wRow = document.querySelector('.toolbar-panel-row--breedte-offset .step-group');
        if (wRow) {
          wRow.title = stripTr('stripWindow.widthGroupTitle');
          var lw = wRow.querySelector('label');
          if (lw) lw.textContent = stripTr('stripWindow.widthLabel');
          var b1 = document.getElementById('btn-w-Lplus');
          var b2 = document.getElementById('btn-w-Lminus');
          var b3 = document.getElementById('btn-w-Rminus');
          var b4 = document.getElementById('btn-w-Rplus');
          if (b1) b1.title = stripTr('stripWindow.wLplusTitle');
          if (b2) b2.title = stripTr('stripWindow.wLminusTitle');
          if (b3) b3.title = stripTr('stripWindow.wRminusTitle');
          if (b4) b4.title = stripTr('stripWindow.wRplusTitle');
        }
        var spread = document.querySelector('.toolbar-panel-row--spread');
        if (spread) {
          var hg = spread.querySelector('.step-group:first-child');
          if (hg) {
            hg.title = stripTr('stripWindow.heightGroupTitle');
            var lh = hg.querySelector('label');
            if (lh) lh.textContent = stripTr('stripWindow.heightLabel');
          }
          var ht1 = document.getElementById('btn-h-Tplus');
          var ht2 = document.getElementById('btn-h-Tminus');
          var hb1 = document.getElementById('btn-h-Bminus');
          var hb2 = document.getElementById('btn-h-Bplus');
          if (ht1) ht1.title = stripTr('stripWindow.hTplusTitle');
          if (ht2) ht2.title = stripTr('stripWindow.hTminusTitle');
          if (hb1) hb1.title = stripTr('stripWindow.hBminusTitle');
          if (hb2) hb2.title = stripTr('stripWindow.hBplusTitle');
          var cg = spread.querySelector('.step-group--compress-stack');
          if (cg) cg.title = stripTr('stripWindow.pushGroupTitle');
          var csl = cg && cg.querySelector('.compress-stack-label');
          if (csl) csl.textContent = stripTr('stripWindow.pushLabel');
          var vu = document.getElementById('btn-vert-stretch');
          var vd = document.getElementById('btn-vert-compress');
          if (vu) {
            vu.textContent = stripTr('stripWindow.btnVertUp');
            vu.title = stripTr('stripWindow.btnVertUpTitle');
          }
          if (vd) {
            vd.textContent = stripTr('stripWindow.btnVertDown');
            vd.title = stripTr('stripWindow.btnVertDownTitle');
          }
        }
        var posLab = document.querySelector('.positie-label');
        if (posLab) posLab.textContent = stripTr('stripWindow.positionLabel');
        var bt = document.getElementById('btn-top');
        var bm = document.getElementById('btn-middle');
        var bb = document.getElementById('btn-bottom');
        if (bt) {
          bt.textContent = stripTr('stripWindow.btnTop');
          bt.title = stripTr('stripWindow.btnTopTitle');
        }
        if (bm) {
          bm.textContent = stripTr('stripWindow.btnMiddle');
          bm.title = stripTr('stripWindow.btnMiddleTitle');
        }
        if (bb) {
          bb.textContent = stripTr('stripWindow.btnBottom');
          bb.title = stripTr('stripWindow.btnBottomTitle');
        }
        var belowA = document.querySelector('.toolbar-panel-row--below-anchor');
        if (belowA) {
          var sgs = belowA.querySelectorAll('.step-group');
          if (sgs[0]) {
            sgs[0].title = stripTr('stripWindow.handGroupTitle');
            var lm = sgs[0].querySelector('label');
            if (lm) lm.textContent = stripTr('stripWindow.moveLabel');
          }
          if (sgs[1]) {
            sgs[1].title = stripTr('stripWindow.stepGroupTitle');
            var ls = sgs[1].querySelector('label');
            if (ls) ls.textContent = stripTr('stripWindow.stepLabel');
          }
        }
        var hL = document.getElementById('btn-hand-left');
        var hR = document.getElementById('btn-hand-right');
        var hU = document.getElementById('btn-hand-up');
        var hD = document.getElementById('btn-hand-down');
        if (hL) hL.title = stripTr('stripWindow.handLeftTitle');
        if (hR) hR.title = stripTr('stripWindow.handRightTitle');
        if (hU) hU.title = stripTr('stripWindow.handUpTitle');
        if (hD) hD.title = stripTr('stripWindow.handDownTitle');
        var s1 = document.getElementById('btn-step-1');
        var s10 = document.getElementById('btn-step-10');
        if (s1) s1.title = stripTr('stripWindow.step1Title');
        if (s10) s10.title = stripTr('stripWindow.step10Title');
        if (img) img.alt = stripTr('stripWindow.imgAlt');
        if (placeholder) placeholder.textContent = stripTr('stripPreview.noScanLoaded');
        if (inputVerticalAnchorK) inputVerticalAnchorK.title = stripTr('stripPreview.verticalAnchorInputTitle');
        var lineLab = document.querySelector('label[for="strip-vertical-anchor-k"]');
        if (lineLab) lineLab.textContent = stripTr('stripPreview.lineIndexLabel');
        var anchorRow = document.querySelector('.toolbar-panel__anchor-row--right');
        if (anchorRow) anchorRow.title = stripTr('stripPreview.anchorRowTitle');
        var btnLU = document.getElementById('btn-line-index-up');
        var btnLD = document.getElementById('btn-line-index-down');
        if (btnLU) {
          btnLU.textContent = stripTr('stripPreview.lineStepUpButton');
          btnLU.title = stripTr('stripPreview.lineStepUpTitle');
        }
        if (btnLD) {
          btnLD.textContent = stripTr('stripPreview.lineStepDownButton');
          btnLD.title = stripTr('stripPreview.lineStepDownTitle');
        }
      }
      function loadStripPreviewLocale() {
        if (!api.getTranslations) {
          stripLocaleDict = {};
          applyStripPreviewLocaleStrings();
          updateScanGotoHints(lastPayload);
          return Promise.resolve();
        }
        return api.getTranslations().then(function (d) {
          stripLocaleDict = d && typeof d === 'object' ? d : {};
          applyStripPreviewLocaleStrings();
          updateScanGotoHints(lastPayload);
        }).catch(function () {
          stripLocaleDict = {};
          applyStripPreviewLocaleStrings();
          updateScanGotoHints(lastPayload);
        });
      }
      loadStripPreviewLocale();
      if (api.onStripLocaleChanged) api.onStripLocaleChanged(function () { loadStripPreviewLocale(); });

      let stepPx = 1;
      /** Voorkomt opnieuw laden van dezelfde data-URL bij elke grid-only merge vanuit main. */
      let lastStripDataUrlApplied = '';
      let activeJump = 'bottom';
      /** Tijdens programmatisch scrollen geen reset van activeJump (anders zou elke auto-scroll 'manual' lijken). */
      let suppressActiveJumpClearOnScroll = false;

      var VIEWPORT_PADDING = 16;
      var ZOOM_FIT_MIN = 0.05;
      var ZOOM_FIT_MAX = 20;

      function getEffectiveZoomScale() {
        var mode = zoomSelect.value;
        if (mode === 'fit-width' || mode === 'fit-height') {
          if (!lastPayload) return 1;
          var w = Math.max(1, lastPayload.displayWidth || 1);
          var extH = Math.max(1, lastPayload.extendedDisplayHeight || lastPayload.displayHeight || 1);
          var vw = Math.max(1, viewport.clientWidth);
          var vh = Math.max(1, viewport.clientHeight);
          var innerW = Math.max(1, vw - VIEWPORT_PADDING * 2);
          var innerH = Math.max(1, vh - VIEWPORT_PADDING * 2);
          var z = mode === 'fit-width' ? innerW / w : innerH / extH;
          return Math.max(ZOOM_FIT_MIN, Math.min(ZOOM_FIT_MAX, z));
        }
        var num = parseFloat(mode);
        return Number.isFinite(num) && num > 0 ? num : 1;
      }

      const btnStep1 = document.getElementById('btn-step-1');
      const btnStep10 = document.getElementById('btn-step-10');
      const btnTop = document.getElementById('btn-top');
      const btnMiddle = document.getElementById('btn-middle');
      const btnBottom = document.getElementById('btn-bottom');

      function updateActiveButtons() {
        btnStep1.classList.toggle('btn-active', stepPx === 1);
        btnStep10.classList.toggle('btn-active', stepPx === 10);
        btnTop.classList.toggle('btn-active', activeJump === 'top');
        btnMiddle.classList.toggle('btn-active', activeJump === 'middle');
        btnBottom.classList.toggle('btn-active', activeJump === 'bottom');
      }

      function updateScanGotoHints(payload) {
        if (!inputScanGoto) return;
        if (!payload) {
          inputScanGoto.removeAttribute('max');
          inputScanGoto.placeholder = '1';
          inputScanGoto.title = stripTr('stripWindow.scanGotoRowTitle');
          if (document.activeElement !== inputScanGoto) inputScanGoto.value = '';
          return;
        }
        var n = payload.projectScanCount != null ? Math.floor(Number(payload.projectScanCount)) : NaN;
        if (Number.isFinite(n) && n >= 1) {
          inputScanGoto.max = String(n);
          inputScanGoto.placeholder = '1–' + n;
          var cur = payload.projectScanIndex != null ? Math.floor(Number(payload.projectScanIndex)) : null;
          inputScanGoto.title =
            cur != null && cur >= 1
              ? stripTrFmt('stripWindow.scanGotoTitleWithCur', { max: n, cur: cur })
              : stripTrFmt('stripWindow.scanGotoTitleRangeOnly', { max: n });
          if (document.activeElement !== inputScanGoto && cur != null && cur >= 1) inputScanGoto.value = String(cur);
        } else {
          inputScanGoto.removeAttribute('max');
          inputScanGoto.placeholder = '1';
          inputScanGoto.title = stripTr('stripWindow.scanGotoTitleNoMax');
        }
      }

      function doScanGoto() {
        if (!api.gotoProjectScan) return;
        var raw = inputScanGoto ? String(inputScanGoto.value).trim() : '';
        var v = raw === '' ? NaN : parseInt(raw, 10);
        if (!Number.isFinite(v) || v < 1) {
          alert(stripTr('stripWindow.scanGotoInvalidAlert'));
          return;
        }
        setBusy(true);
        api.gotoProjectScan(v);
      }

      function sendWidthEdge(edge, deltaSign) {
        if (!api.applyWidthEdge) return;
        api.applyWidthEdge(edge, deltaSign * stepPx);
        setBusy(true);
      }

      function sendHeightEdge(edge, deltaSign) {
        if (!api.applyHeightEdge) return;
        api.applyHeightEdge(edge, deltaSign * stepPx);
        setBusy(true);
      }

      function setBusy(busy) {
        document.body.style.pointerEvents = busy ? 'none' : '';
        document.body.style.opacity = busy ? '0.85' : '1';
      }

      function applyAbsolute() {
        if (!api.setGridOffsetAbsolute) return;
        const x = parseInt(inputX.value, 10);
        const y = parseInt(inputY.value, 10);
        const yBottom = parseInt(inputYBottom.value, 10);
        api.setGridOffsetAbsolute(isNaN(x) ? 0 : x, isNaN(y) ? 0 : y, isNaN(yBottom) ? 0 : yBottom);
        setBusy(true);
      }

      function sendDelta(dx, dy) {
        if (!api.sendGridOffsetDelta) return;
        api.sendGridOffsetDelta(dx, dy, 'hand');
        setBusy(true);
      }

      function updateInputsFromPayload(p) {
        if (!p) return;
        if (p.gridOffsetX != null && document.activeElement !== inputX) inputX.value = String(Math.round(p.gridOffsetX));
        if (p.gridOffsetY != null && document.activeElement !== inputY) inputY.value = String(Math.round(p.gridOffsetY));
        if (p.gridOffsetYBottom != null && document.activeElement !== inputYBottom) inputYBottom.value = String(Math.round(p.gridOffsetYBottom));
      }

      function updateHeaderFilename(p) {
        if (!headerFilenameEl) return;
        var raw = p && p.lintFileName != null ? String(p.lintFileName).trim() : '';
        if (!raw) {
          headerFilenameEl.textContent = '—';
          headerFilenameEl.title = '';
        } else {
          headerFilenameEl.textContent = raw;
          headerFilenameEl.title = raw;
        }
      }

      function refLineDisplayFromPayload(p) {
        const gr = p.gridRects;
        if (!gr || gr.length === 0) return null;
        const n = gr.length;
        var k = p.verticalAnchorCustomK != null ? Math.round(Number(p.verticalAnchorCustomK)) : n;
        if (!Number.isFinite(k)) k = n;
        k = Math.max(0, Math.min(n, k));
        const r0 = gr[0];
        var x0 = Number(r0.x) || 0;
        var w0 = Math.max(0, Number(r0.width) || 0);
        if (w0 <= 0) return null;
        var yLine;
        if (k <= 0) yLine = Number(r0.y) || 0;
        else if (k >= n) {
          var last = gr[n - 1];
          yLine = (Number(last.y) || 0) + Math.max(0, Number(last.height) || 0);
        } else {
          var r = gr[k];
          yLine = Number(r.y) || 0;
        }
        return { y: yLine, x0: x0, w: w0 };
      }

      function drawGrid(p) {
        if (!overlay) return;
        if (!p || !Array.isArray(p.gridRects) || p.gridRects.length === 0) {
          try {
            var octx = overlay.getContext('2d');
            if (octx && overlay.width > 0 && overlay.height > 0) octx.clearRect(0, 0, overlay.width, overlay.height);
          } catch (e) {}
          overlay.style.display = 'none';
          return;

        const h = Math.max(1, p.extendedDisplayHeight || p.displayHeight || 1);

        const pixelH = Math.max(1, Math.round(h * zoom));

        overlay.height = pixelH;
        overlay.style.width = w + 'px';
        overlay.style.height = h + 'px';
        overlay.style.display = 'block';

        if (!ctx) return;
        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.clearRect(0, 0, w, h);
        const lineW = Math.max(0.3, 1 / zoom);
        const lineWActive = Math.max(0.5, 2 / zoom);
        const activeNum = p.activeFrameNumber != null ? p.activeFrameNumber : (p.activeFrameIndex != null ? p.activeFrameIndex + 1 : 1);
        for (let i = 0; i < p.gridRects.length; i++) {
          const r = p.gridRects[i];
          const x = Number(r.x) || 0;
          const y = Number(r.y) || 0;
          const rw = Math.max(0, Number(r.width) || 0);
          const rh = Math.max(0, Number(r.height) || 0);
          if (rw <= 0 || rh <= 0) continue;
          const isActive = (r.frameNumber != null && r.frameNumber === activeNum);

          ctx.lineTo(ref.x0 + ref.w, ref.y);

        const rh = Math.max(0, Number(rect.height) || 0);
        const cx = left + rw / 2;

        var ck = parseInt(inputVerticalAnchorK.value, 10);
        if (!Number.isFinite(ck)) ck = 1;
        var n = lastPayload && (lastPayload.numFrames || (lastPayload.gridRects && lastPayload.gridRects.length)) || 1;
        n = Math.max(1, Math.floor(Number(n)) || 1);
        ck = Math.max(0, Math.min(n, ck));
        inputVerticalAnchorK.value = String(ck);
        if (lastPayload) {
          var pk = lastPayload.verticalAnchorCustomK != null ? Math.round(Number(lastPayload.verticalAnchorCustomK)) : n;
          if (ck === pk) return false;
        }
        setBusy(true);
        api.setVerticalAnchor('pivotCustom', ck);
        return true;
      }
      if (inputVerticalAnchorK) {
        var lastLineKSentByEnterAt = 0;
        inputVerticalAnchorK.addEventListener('change', function () {
          /* Enter-commit vuurt ook 'change' → dubbele send voorkomen. */
          if (Date.now() - lastLineKSentByEnterAt < 120) return;
          sendVerticalAnchorFromUi();
        });
        inputVerticalAnchorK.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            lastLineKSentByEnterAt = Date.now();
            sendVerticalAnchorFromUi();
          }
        });
      }
      if (chkPanelLink && api.setPanelLinkVerticalAnchor) {
        chkPanelLink.addEventListener('change', function () {
          var on = chkPanelLink.checked;
          if (lastPayload && on === (lastPayload.panelLinkVerticalAnchor !== false)) {
            updateStripPanelLinkVisual();
            return;
          }
          updateStripPanelLinkVisual();
          setBusy(true);
          api.setPanelLinkVerticalAnchor(on);
        });
      }
      updateStripPanelLinkVisual();

      document.getElementById('btn-vert-compress').addEventListener('click', function (e) {
        setBusy(true);
        if (e.shiftKey && api.applyVerticalRigidPanBoundary) {
          api.applyVerticalRigidPanBoundary(true);
        } else if (api.applyVerticalFixedBottomStep) {
          api.applyVerticalFixedBottomStep(stepPx, 'compress');
        }
      });
      document.getElementById('btn-vert-stretch').addEventListener('click', function (e) {
        setBusy(true);
        if (e.shiftKey && api.applyVerticalRigidPanBoundary) {
          api.applyVerticalRigidPanBoundary(false);
        } else if (api.applyVerticalFixedBottomStep) {
          api.applyVerticalFixedBottomStep(stepPx, 'stretch');
        }
      });
      document.getElementById('btn-scan-prev').addEventListener('click', function () {
        if (!api.navigateProjectScan) return;
        setBusy(true);
        api.navigateProjectScan('prev');
      });
      document.getElementById('btn-scan-next').addEventListener('click', function () {
        if (!api.navigateProjectScan) return;
        setBusy(true);
        api.navigateProjectScan('next');
      });
      document.getElementById('btn-scan-goto').addEventListener('click', function () {
        doScanGoto();
      });
      if (inputScanGoto) {
        inputScanGoto.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            doScanGoto();
          }
        });
      }
      document.getElementById('strip-preset-save').addEventListener('click', function () {
        var n = document.getElementById('strip-preset-name').value;
        if (api.stripPresetSave) api.stripPresetSave(n);
      });
      document.getElementById('strip-preset-load').addEventListener('click', function () {
        var id = document.getElementById('strip-preset-list').value;
        if (!id) return;
        setBusy(true);
        if (api.stripPresetLoad) api.stripPresetLoad(id);
      });
      document.getElementById('strip-preset-delete').addEventListener('click', function () {
        var id = document.getElementById('strip-preset-list').value;
        if (!id) return;
        if (api.stripPresetDelete) api.stripPresetDelete(id);
      });
      if (api.onPresetsUpdated) api.onPresetsUpdated(function () { refreshStripPresetList(); });
      refreshStripPresetList();

      var btnAlignWin = document.getElementById('btn-open-align-window');
      if (btnAlignWin && api.openAlignPreview) {
        btnAlignWin.addEventListener('click', function () {
          api.openAlignPreview().catch(function () {});
        });
      }
      var btnStripRefresh = document.getElementById('btn-strip-refresh');
      if (btnStripRefresh && api.requestStripRefresh) {
        btnStripRefresh.addEventListener('click', function () {
          setBusy(true);
          api.requestStripRefresh();
        });
      }

      updateActiveButtons();
    })();
  </script>
</body>
</html>
