<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film2Frame – Output preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .caption { flex-shrink: 0; padding: 8px; font-size: 12px; color: #888; }
    #output-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .placeholder { color: #666; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <p class="caption" id="caption">Laatste weggeschreven frame</p>
  <img id="output-img" alt="Output frame" />
  <p class="placeholder" id="placeholder">Geen frame. Start batch of bewaar huidige scan.</p>
  <script>
    (function () {
      const img = document.getElementById('output-img');
      const placeholder = document.getElementById('placeholder');
      const api = window.outputPreviewApi;
      if (!api || !api.onOutputImage) return;
      api.onOutputImage(function (payload) {
        if (payload && payload.dataUrl) {
          img.src = payload.dataUrl;
          img.style.display = 'block';
          placeholder.style.display = 'none';
        } else {
          img.src = '';
          img.style.display = 'none';
          placeholder.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
